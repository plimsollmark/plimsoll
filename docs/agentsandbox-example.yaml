# An example agent-sandbox setup that plimsoll's read-back accepts (docs/agentsandbox.md):
# the service account plimsolld runs as, with only the access the provider uses; a gVisor
# template whose pods serve sandboxd behind plimsoll's TLS terminator; and a warm pool of
# two. Replace the digest placeholder with the SHA-256, in hex, of the token in
# SANDBOX_AGENTSANDBOX_SANDBOXD_TOKEN_FILE, and give plimsolld's own pods the label
# app.kubernetes.io/name: plimsolld, which the template's policy admits to the terminator's
# port. The RuntimeClass assumes nodes whose containerd has a runsc handler (gVisor's
# installation guide).
#
# Each pod's own key and certificate come from cert-manager's CSI driver, signed by a CA
# issuer in the pool's namespace (below). Install both first (versions run: cert-manager
# v1.21.3, its CSI driver v0.16.1):
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.21.3/cert-manager.yaml
#   helm install cert-manager-csi-driver oci://quay.io/jetstack/charts/cert-manager-csi-driver \
#     --version v0.16.1 -n cert-manager
# Once the issuer below is ready, its CA certificate goes to plimsolld:
#   kubectl -n default get secret plimsoll-ca -o jsonpath='{.data.tls\.crt}' | base64 -d > ca.crt
# No account but yours and the driver's may create certificaterequests in this namespace:
# the CA issuer signs every request made here (docs/agentsandbox.md, "What the operator sets
# up"), so bind neither the edit nor the admin role here to anyone else.
#
#   plimsolld: SANDBOX_PROVIDER=agentsandbox SANDBOX_AGENTSANDBOX_NAMESPACE=default
#              SANDBOX_AGENTSANDBOX_WARM_POOL=plimsoll-run SANDBOX_AGENTSANDBOX_RUNTIME_CLASS=gvisor
#              SANDBOX_AGENTSANDBOX_IMAGE=<the image> SANDBOX_AGENTSANDBOX_SANDBOXD_TOKEN_FILE=<file>
#              SANDBOX_AGENTSANDBOX_SANDBOXD_CA_FILE=<ca.crt>
#              SANDBOX_AGENTSANDBOX_SANDBOXD_TRUST_DOMAIN=plimsoll.example
#              PLIMSOLL_ADDR=0.0.0.0:8746 (unset, it listens on its own pod's loopback only)
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: gvisor}
handler: runsc
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: plimsoll, namespace: default}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: plimsoll, namespace: default}
rules:
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxclaims]
  verbs: [create, get, list, delete]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxwarmpools, sandboxtemplates]
  verbs: [get]
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [get]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: plimsoll, namespace: default}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: plimsoll}
subjects: [{kind: ServiceAccount, name: plimsoll, namespace: default}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: plimsoll-runtimeclasses}
rules:
- apiGroups: [node.k8s.io]
  resources: [runtimeclasses]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: plimsoll-runtimeclasses}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: plimsoll-runtimeclasses}
subjects: [{kind: ServiceAccount, name: plimsoll, namespace: default}]
---
# Under Kata only (the vm tier): each run reads its pod's node for the node's boot ID.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: plimsoll-nodes}
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: plimsoll-nodes}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: plimsoll-nodes}
subjects: [{kind: ServiceAccount, name: plimsoll, namespace: default}]
---
# The CA: a self-signed root that cert-manager makes and keeps in the Secret plimsoll-ca,
# and a CA issuer on it, in the pool's namespace. cert-manager renews the root before it
# expires, with a new key by default; put the new certificate in plimsolld's CA file
# beside the old one when it does (docs/agentsandbox.md, "What it does not stop").
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: selfsigned, namespace: default}
spec: {selfSigned: {}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: {name: plimsoll-ca, namespace: default}
spec:
  isCA: true
  commonName: plimsoll-sandbox-ca
  secretName: plimsoll-ca
  duration: 8760h
  privateKey: {algorithm: ECDSA, size: 256}
  issuerRef: {name: selfsigned, kind: Issuer, group: cert-manager.io}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: plimsoll-ca, namespace: default}
spec: {ca: {secretName: plimsoll-ca}}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata: {name: plimsoll-run, namespace: default}
spec:
  networkPolicy:
    ingress:
    - from:
      - podSelector: {matchLabels: {app.kubernetes.io/name: plimsolld}}
      ports:
      - {port: 9090, protocol: TCP}
  podTemplate:
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig: {nameservers: [127.0.0.1]}
      containers:
      - name: sandboxd
        image: plimsoll/sandbox-agentsandbox:dev  # built from docker/agentsandbox.Dockerfile; pin it by @sha256: in production
        # The TLS terminator, then sandboxd's flags: sandboxd on loopback port 9091, behind it.
        command: ["/usr/local/bin/plimsoll-sandboxd-tls", "--root-dir=/work", "--listen-host=127.0.0.1", "--rest-port=8080", "--grpc-port=9091", "--auth-token-sha256=<sha256 of the sandboxd token, hex>"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL], add: [SETUID, SETGID]}
        resources:
          limits: {memory: 256Mi, cpu: "1"}
        ports: [{containerPort: 9090}]
        terminationMessagePath: /root/termination-log
        readinessProbe:
          tcpSocket: {port: 9090}
          periodSeconds: 2
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: tmp, mountPath: /tmp}
        - {name: sandboxd-tls, mountPath: /etc/plimsoll/sandboxd-tls, readOnly: true}
      volumes:
      - {name: work, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
      - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
      # The pod's own key pair: made on the node as the pod starts, signed by the CA issuer
      # above for this pod alone (its namespace, name and UID in the one URI name), mounted
      # mode 0440 for root. plimsoll accepts exactly these attributes, duration optional.
      - name: sandboxd-tls
        csi:
          driver: csi.cert-manager.io
          readOnly: true
          volumeAttributes:
            csi.cert-manager.io/issuer-name: plimsoll-ca
            csi.cert-manager.io/issuer-kind: Issuer
            csi.cert-manager.io/dns-names: sandboxd.plimsoll.invalid
            csi.cert-manager.io/uri-sans: "spiffe://plimsoll.example/ns/${POD_NAMESPACE}/pod/${POD_NAME}/${POD_UID}"
            csi.cert-manager.io/key-algorithm: ECDSA
            csi.cert-manager.io/key-size: "256"
            csi.cert-manager.io/key-encoding: PKCS8
            csi.cert-manager.io/key-usages: "server auth,digital signature"
            csi.cert-manager.io/duration: 720h
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata: {name: plimsoll-run, namespace: default}
spec:
  replicas: 2
  sandboxTemplateRef: {name: plimsoll-run}
