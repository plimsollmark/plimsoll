<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1456" viewBox="0 0 1200 1456" role="img" aria-labelledby="title description">
  <title id="title">How plimsoll supplies a run's host-API credential</title>
  <desc id="description">The caller authenticates to plimsolld and selects a server-held grant profile. The server checks the profile's caller list and supplies identity, scopes, routes, and the run budget to TokenMinter. JWT profiles create a fresh signed token; static profiles return the configured bearer unchanged. During execution, guest calls reach the shared broker through provider adapters. The broker checks the route and budgets and attaches the downstream credential. For JWT profiles, the target API must verify the signature, audience, time claims, identity, and permissions. The built-in JWT contains caller identity, audience, optional scopes, timestamps, and a random token ID. Its lifetime is bounded by the configured limit and, when supplied, the run budget plus a five-second grace. A token ID alone does not prevent replay, and ending a run does not revoke its token.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#50728b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #203749; }
      .title { font-size: 38px; font-weight: 720; letter-spacing: -1px; }
      .section { font-size: 25px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .muted { fill: #50677a; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 1.6px; }
      .mono { font-family: ui-monospace, "Cascadia Code", monospace; font-size: 16px; }
      .blue { fill: #175881; }
      .orange { fill: #8e4c16; }
      .green { fill: #256341; }
      .line { fill: none; stroke: #50728b; stroke-width: 2; marker-end: url(#arrow); }
      .panel { fill: #fff; stroke: #d7e1e8; }
      .host { fill: #eef6fc; stroke: #b3ccdf; }
      .guest { fill: #fff5e9; stroke: #e3c6a2; }
    </style>
  </defs>
  <rect width="1200" height="1456" fill="#f5f8fa"/>
  <text x="48" y="45" class="eyebrow muted">PLIMSOLL / CREDENTIAL MINTING TODAY</text>
  <text x="48" y="96" class="title">How a run gets its API credential</text>
  <text x="48" y="132" class="body muted">Caller authentication and downstream API access are separate credential roles.</text>

  <g id="authorize-and-mint">
    <rect x="32" y="164" width="1136" height="368" rx="18" class="panel"/>
    <circle cx="67" cy="204" r="17" fill="#e4eef5"/><text x="67" y="211" text-anchor="middle" class="body blue">1</text>
    <text x="97" y="212" class="section">Before execution: authorize, then mint</text>
    <text x="60" y="249" class="body muted">The caller selects a profile name. The server owns its routes, scopes, and token configuration.</text>

    <g id="caller">
      <rect x="60" y="278" width="284" height="186" rx="12" fill="#f6f8fa" stroke="#cbd7e0"/>
      <text x="82" y="313" class="heading">Authenticated caller</text>
      <text x="82" y="348" class="body">Caller token authenticates</text>
      <text x="82" y="377" class="body">the request to plimsolld</text>
      <text x="82" y="416" class="mono">grant_profile = name</text>
      <text x="82" y="445" class="small muted">Server derives caller identity</text>
    </g>
    <path d="M350 367 H394" class="line"/>

    <g id="profile">
      <rect x="406" y="278" width="376" height="186" rx="12" class="host"/>
      <text x="428" y="313" class="heading blue">Server-held grant</text>
      <text x="428" y="348" class="body">Check the profile's caller list</text>
      <text x="428" y="377" class="body">Supply caller identity + scopes</text>
      <text x="428" y="406" class="body">Supply routes + run time budget</text>
      <text x="428" y="445" class="small muted">JWT audience + signing key are config</text>
    </g>
    <path d="M788 367 H834" class="line"/>

    <g id="minter">
      <rect x="846" y="278" width="294" height="186" rx="12" class="host"/>
      <text x="868" y="313" class="heading blue">TokenMinter</text>
      <text x="868" y="348" class="body">Called once for this run</text>
      <text x="868" y="377" class="body">JWT → fresh signed token</text>
      <text x="868" y="406" class="body">Static → same bearer</text>
      <text x="868" y="445" class="small muted">Token stays in broker ↓</text>
    </g>
    <text x="60" y="500" class="small muted">JWT minting refuses a missing authenticated identity. A grant without a minter adds no bearer header.</text>
  </g>

  <g id="brokered-call">
    <rect x="32" y="556" width="1136" height="376" rx="18" class="panel"/>
    <circle cx="67" cy="596" r="17" fill="#e4eef5"/><text x="67" y="603" text-anchor="middle" class="body blue">2</text>
    <text x="97" y="604" class="section">During execution: guest asks, broker sends</text>
    <text x="60" y="641" class="body muted">Provider adapters carry the call. The downstream credential is attached only by the broker.</text>

    <g id="guest">
      <rect x="60" y="674" width="284" height="186" rx="12" class="guest"/>
      <text x="82" y="709" class="heading">Guest code</text>
      <text x="82" y="748" class="mono">host.get('/items')</text>
      <text x="82" y="787" class="body">Sends method, path, body</text>
      <text x="82" y="826" class="small orange">No API token injected into JS</text>
    </g>
    <path d="M350 767 H394" class="line"/>

    <g id="broker">
      <rect x="406" y="674" width="376" height="186" rx="12" class="host"/>
      <text x="428" y="709" class="heading blue">Shared host-side broker</text>
      <text x="428" y="744" class="body">Hold this run's credential</text>
      <text x="428" y="773" class="body">Check exact route + traffic budgets</text>
      <text x="428" y="810" class="mono">Authorization: Bearer &lt;token&gt;</text>
      <text x="428" y="839" class="small blue">Route policy is enforced here</text>
    </g>
    <path d="M788 767 H834" class="line"/>

    <g id="api">
      <rect x="846" y="674" width="294" height="186" rx="12" fill="#eff8f2" stroke="#b5d5bf"/>
      <text x="868" y="709" class="heading green">Target API (JWT)</text>
      <text x="868" y="744" class="body">Verify signature + audience</text>
      <text x="868" y="773" class="body">Check time + identity claims</text>
      <text x="868" y="802" class="body">Enforce API permissions</text>
      <text x="868" y="839" class="small muted">Static mode uses the API's auth</text>
    </g>
    <text x="60" y="898" class="small muted">One run can make multiple allowed calls with the same token. Responses return through the broker.</text>
  </g>

  <g id="jwt-contract">
    <rect x="32" y="956" width="1136" height="428" rx="18" class="panel"/>
    <circle cx="67" cy="996" r="17" fill="#e4eef5"/><text x="67" y="1003" text-anchor="middle" class="body blue">3</text>
    <text x="97" y="1004" class="section">What does the built-in JWT promise?</text>
    <text x="60" y="1041" class="body muted">A JSON Web Token (JWT) carries signed claims. HS256 uses a secret shared with the target API.</text>

    <g id="claims">
      <rect x="60" y="1068" width="518" height="250" rx="12" class="host"/>
      <text x="82" y="1103" class="heading blue">Claims the API can check</text>
      <text x="82" y="1142" class="mono">sub</text><text x="227" y="1142" class="body">Authenticated caller identity</text>
      <text x="82" y="1175" class="mono">aud</text><text x="227" y="1175" class="body">Intended target API</text>
      <text x="82" y="1208" class="mono">scope</text><text x="227" y="1208" class="body">Declared scopes, if supplied</text>
      <text x="82" y="1241" class="mono">iat/nbf/exp</text><text x="227" y="1241" class="body">Issued, valid-from, expiry times</text>
      <text x="82" y="1274" class="mono">jti</text><text x="227" y="1274" class="body">Fresh random token ID</text>
      <text x="82" y="1302" class="small muted">Optional: issuer claim (iss) and key-ID header (kid).</text>
    </g>
    <g id="limits">
      <rect x="602" y="1068" width="538" height="250" rx="12" fill="#f6f8fa" stroke="#cbd7e0"/>
      <text x="624" y="1103" class="heading">Lifetime and limits</text>
      <text x="624" y="1142" class="body">Lifetime ≤ configured token limit</text>
      <text x="624" y="1175" class="body">Also ≤ positive run budget + 5-second grace</text>
      <text x="624" y="1208" class="body">The API must enforce the token's expiry</text>
      <text x="624" y="1241" class="body">Routes stay in broker policy, not JWT claims</text>
      <text x="624" y="1274" class="body">A token ID alone does not prevent replay</text>
      <text x="624" y="1302" class="small muted">The grace is the code's margin around the run budget.</text>
    </g>
    <text x="60" y="1354" class="small muted">Static mode adds no expiry. Ending a run does not revoke a JWT; it may remain valid until its expiry.</text>
  </g>
  <text x="48" y="1420" class="small muted">The credential stays in host code. WASM still shares the server process; it is not a hard security boundary.</text>
  <text x="48" y="1447" class="small muted">Current implementation shown. Possible enhancements are separate proposals in the companion guide.</text>
</svg>
