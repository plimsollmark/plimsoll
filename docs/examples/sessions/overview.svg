6" y="86" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a1a1a">1f7a2e0742…</text><line x1="380" y1="65" x2="348" y2="65" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="564" y="26" width="150" height="78" rx="7" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/><text x="574" y="46" font-size="13" font-weight="600" fill="#1a1a1a">call 4 · snippet</text><text x="574" y="66" font-size="11.5" fill="#5a5a5a">record</text><text x="620" y="66" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a1a1a">81f7c8a438…</text><text x="574" y="86" font-size="11.5" fill="#5a5a5a">previous</text><text x="630" y="86" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a1a1a">5627658544…</text><line x1="564" y1="65" x2="532" y2="65" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="748" y="26" width="150" height="78" rx="7" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/><text x="758" y="46" font-size="13" font-weight="600" fill="#1a1a1a">call 5 · snippet</text><text x="758" y="66" font-size="11.5" fill="#5a5a5a">record</text><text x="804" y="66" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a1a1a">86d1540081…</text><text x="758" y="86" font-size="11.5" fill="#5a5a5a">previous</text><text x="814" y="86" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a1a1a">81f7c8a438…</text><line x1="748" y1="65" x2="716" y2="65" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="932" y="26" width="150" height="78" rx="7" fill="#e6f4ea" stroke="#1baf7a" stroke-width="1.5"/><text x="942" y="46" font-size="13" font-weight="600" fill="#1e6b2f">close</text><text x="942" y="66" font-size="11.5" fill="#1e6b2f">5 calls</text><text x="942" y="86" font-size="11.5" fill="#1e6b2f">last </text><text x="972" y="86" font-size="11.5" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1e6b