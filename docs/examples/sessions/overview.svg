<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">One workspace, several calls</title>
<desc id="desc">Files survive the next call. Each record names the previous one. The saved report checks the chain and rejects changed evidence.</desc>
<rect width="1200" height="600" rx="18" fill="#f6f9fc"/>
<g font-family="system-ui, sans-serif" fill="#193449">
<text x="52" y="58" font-size="18" letter-spacing="2" fill="#145ca0">PLIMSOLL · SAVED RUN</text>
<text x="52" y="117" font-size="38" font-weight="700">One workspace, several calls</text>
