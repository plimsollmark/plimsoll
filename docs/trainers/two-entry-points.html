        "explainer":{"try":"Read the tool descriptions your own MCP server ships. If a reader cannot tell from the description alone which tool is cheap and which is heavy, the model cannot either.","idea":"Snippet and project are different contracts, not different modes. Different providers support them, they fail differently, and they cost differently, so they are advertised separately and the cheap one is the default.","points":["The tool names differ by consumer. One gateway may register them as <code>run_javascript</code> and <code>run_project</code>, another as <code>run_code</code> and <code>run_project</code>. The underlying operations are <code>RunJavaScript</code> and <code>RunProject</code> on the <code>Sandbox</code> interface, whatever a caller calls them.","Two well described tools beat one tool with a mode flag, because the model chooses from a menu instead of reasoning about a branch.","Worth knowing for comparison: Cloudflare Code Mode, and Stainless before Anthropic absorbed it in May 2026, expose a single execute tool, because they only ever run snippets against a generated SDK. The second entry point exists here because plimsoll also builds multi file work. That is a capability difference, not an interface inconsistency."]}

        "explainer":{"try":"Set per run memory to 128 MiB and note the accepted count. Now set it to 512 MiB without touching anything else. The max concurrent setting did not change, but effective capacity collapsed, because the aggregate budget clamps it.","idea":"Effective capacity is the smaller of your concurrency cap and what the aggregate memory budget can actually hold. A heavy operation does not just cost its own caller more, it removes slots from everyone else.","points":["<code>SANDBOX_TOTAL_MEMORY_MB</code> clamps max concurrent to total divided by per run, so concurrent runners cannot oversubscribe the host. The clamp is ignored for E2B, whose runners live off host.","This is why the tool description matters as much as the code. Steering an agent to the snippet by default is a capacity decision, not a style preference.","Shed load is not a failure of the service. A caller that is refused admission gets a typed <code>ErrAtCapacity</code> before anything runs, which is a far better outcome than a host that accepted everything and thrashed."]}
