syntax = "proto3";

// Package plimsoll.v1 is the RPC surface of the standalone code-execution
// sandbox. It mirrors the transport-agnostic sandbox.Sandbox interface so any
// provider (wasm, docker/gVisor, e2b) can back it. Callers reach it over
// Connect/gRPC; access requires the "code:run" scope.
package plimsoll.v1;

option go_package = "github.com/plimsollmark/plimsoll/gen/go/plimsoll/v1;plimsollv1";

// SandboxService runs untrusted, agent-authored code in an isolated runtime.
service SandboxService {
  // Run executes exactly one operation: a JavaScript snippet, a multi-file
  // project, or a compiled simulator over a parameter table. The request is an
  // envelope (protocol number, isolation floor, trace id, timeout) around a
  // oneof payload; the response is an envelope (provider, isolation evidence,
  // duration) around the matching result. One procedure, one scope, one place
  // where the floor is checked before admission and dispatch.
  //
  // The protocol number is the mixed-version gate. Protobuf drops fields a
  // receiver does not know, so a daemon that predates a security-relevant
  // request field (a floor, a limit, a capability restriction) would execute the
  // request without it. A client therefore states the protocol it speaks and a
  // daemon serves exactly one: a request that omits it is InvalidArgument and a
  // request on any other number is Unimplemented, in both cases before the
  // payload is read. The number is bumped when such a field is added; an
  // informational field does not bump it. Current number: 8 (the Go constant
  // protocol.Number, which Describe reports).
  rpc Run(RunRequest) returns (RunResponse);
  // Describe reports the protocol number, the active provider, current isolation
  // evidence, and static operation support. Project and module support are
  // structural: they do not prove that the selected image/template contains a
  // particular toolchain or model.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // OpenSession starts a session: one sandbox kept for many calls, in which files
  // a call writes persist for later calls and no process a call starts outlives
  // it. The session belongs to the principal that opened it, and its ID is a
  // capability for that principal. Ownership can move: any holder of that
  // principal's credential who has the session's fingerprint and its exact head
  // (the generation, the count of calls and the last record's digest) may take
  // it over with AttachSession, after which the previous holder's calls and close
  // are refused. Each request states the protocol number and gets Run's check. A
  // daemon without sessions answers Unimplemented, marked not dispatched.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // AttachSession transfers ownership to an authenticated worker whose trusted
  // checkpoint matches the current generation and record chain, or is exactly one call
  // behind it when the caller names that call's request digest
  // (AttachSessionRequest.lost_request_sha256). It runs no code.
  // Every attach costs one of the caller's rate tokens, a refused one included. A
  // session that is unknown, another caller's, closed, ended or past its lifetime is
  // NotFound, all with the same text.
  rpc AttachSession(AttachSessionRequest) returns (AttachSessionResponse);
  // SessionRun runs one call in an open session. Its record is chained to the
  // session's previous call (RunRecord's session fields). The call states the head it
  // expects (SessionRunRequest.head), and runs only when that is the session's head.
  rpc SessionRun(SessionRunRequest) returns (SessionRunResponse);
  // CloseSession ends a session, or collects the end of one that ended by
  // itself, and states how many calls it executed and the last record's digest,
  // which a harness signs so a cut chain is told from a complete one.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // 6 was supports_minimum_isolation and 7 was supports_advisory: feature bits
  // whose only reading was "an older server omits them". The protocol number is
  // the one statement of what this daemon speaks; the numbers stay reserved so
  // they can never be reused with another meaning.
  reserved 6, 7;
  string sandbox = 1; // active provider id (e.g. "docker")
  // isolation is the provider's boundary tier ("vm", "kernel", "container",
  // "process", "none") — see RunResponse.isolation.
  string isolation = 2;
  bool supports_project = 3; // whether a project payload works on this provider
  // Grant support is operation-specific. A provider may support isolated project
  // runs while only having a credential-safe broker for JavaScript snippets.
  bool supports_javascript_grants = 4;
  bool supports_project_grants = 5;
  // Whether a module payload works on this provider: a module image is configured
  // and the provider can supervise its worker. Static discovery, like supports_project.
  bool supports_module = 8;
  // The protocol number this daemon serves (see Run). A client compares it with
  // its own before relying on this daemon; Run checks it again on every request.
  uint32 protocol = 9;
  // What this daemon states about where each payload kind runs, and the per-run
  // resource envelope. Informational, like the tier: configuration and provider
  // evidence, never runtime attestation, and nothing in Run reads them. A router
  // uses them so that two backends with the same tier are not taken for the
  // same environment.
  PayloadEnvironment javascript_environment = 10;
  PayloadEnvironment project_environment = 11;
  PayloadEnvironment module_environment = 12;
  RunResources resources = 13;
  // policy names the sandbox policy the provider verifies before every run, by a
  // content digest prefixed with how it was derived ("openshell-policy:sha256:",
  // the digest OpenShell's gateway itself reports for a policy). Empty when the
  // provider has no such object. Informational, like the environments.
  string policy = 14;
  // Whether OpenSession works here: the provider keeps sessions and the operator
  // enabled them. The lifetime and idle timeout are the daemon's; a request may
  // ask for shorter ones.
  bool supports_sessions = 15;
  uint32 session_lifetime_ms = 16;
  uint32 session_idle_timeout_ms = 17;
  // Where a session's calls run, every kind in the session's one sandbox (on docker
  // the project image, not the snippet image). Stated when supports_sessions is;
  // informational, like the other environments, and what a router filters sessions on.
  PayloadEnvironment session_environment = 18;
  // The caps that bound one caller's sessions, 0 when there is none: how many it may
  // hold (SANDBOX_MAX_SESSIONS_PER_CALLER) and how many one owner of it may
  // (SANDBOX_MAX_SESSIONS_PER_OWNER, the per-user cap OpenSessionRequest.owner names).
  // An app that relies on the per-owner cap across its processes checks it here.
  // Stated with supports_sessions; informational.
  uint32 max_sessions_per_caller = 19;
  uint32 max_sessions_per_owner = 20;
  // How many sandboxes the daemon keeps ready for sessions (SANDBOX_SESSION_POOL), 0
  // when it keeps none: never used, interpreters already running, each handed to one
  // session, or to one Run cell that asked for it (RunRequest.prefer_warm), and deleted
  // after. Stated with supports_sessions; informational.
  uint32 session_pool = 21;
  // isolation_qualification is the sentence the provider's vendor or design requires to
  // stand beside the tier wherever it is stated, empty for a provider with none. The
  // WSL containers provider's per-run mode says there that Microsoft states WSL is not a
  // security sandbox for untrusted code, and names gVisor's position when it is on.
  // Informational, like the tier: configuration and provider evidence, never runtime
  // attestation. Every run's answer and record state the sentence that went with that
  // run's tier (RunResponse.isolation_qualification, record version 5, protocol 6).
  string isolation_qualification = 22;
}

// PayloadEnvironment is one payload kind's environment as the daemon states it.
message PayloadEnvironment {
  // identity names the exact outer image artifact or embedded interpreter, set
  // only when content-addressed. An OCI index can change when attached build
  // metadata changes, even when its selected executable manifest does not.
  // A mutable name (a tag or template name) is never sent.
  string identity = 1;
  // max_timeout_ms is the longest one run of this kind may take on this daemon
  // (the provider's ceiling, capped by the daemon's own). 0 = the kind is
  // unsupported or no ceiling is stated.
  uint32 max_timeout_ms = 2;
  // Selected executable image manifest and platform, separate from the outer
  // index in identity. Empty means the provider cannot establish it.
  string software_identity = 3;
  // The languages this environment's interpreters run, as the provider's startup
  // checks proved them ("javascript", "python"): the languages a project's steps can
  // invoke, and on a provider with sessions the languages a cell may use. Empty when
  // the provider has proved none.
  repeated string languages = 4;
  // file_scopes: on session_environment, the scopes in which the provider's sessions
  // take file calls (SessionRunRequest.files), carried out by plimsoll's own helper, in
  // this enum's order; empty on every other environment, since a file call is a session
  // call, and where the sessions take none. A provider whose work folder is not a mount
  // of its own states FILES_SCOPE_SANDBOX alone (OpenShell, docs/openshell.md).
  // Informational: a file call in a scope a session does not take is refused, not
  // dispatched, reason unsupported.
  repeated FilesScope file_scopes = 6;
  reserved 5;
  reserved "files";
}

// An explicit caller rule for the selected software. Empty mode and identities
// impose no rule. "exact" takes one identity; "approved" takes 1 to 32,
// bounding the caller-controlled list to about 8 KiB at 256 bytes per identity.
message SoftwareRule {
  string mode = 1;
  repeated string identities = 2;
}

// RunResources is the per-run resource envelope the operator configured. Each
// provider refuses to start with a dimension it cannot enforce, so a non-zero
// value is enforced; 0 means the provider's default, which is not stated here.
message RunResources {
  uint32 memory_mb = 1;
  double cpus = 2;
  uint32 pids = 3;
  // disk_mb is the run's writable-storage budget (on docker, the aggregate of
  // every writable mount).
  uint32 disk_mb = 4;
}

// AdviceFinding is one metadata-only efficiency observation about a run's brokered
// host.* calls (Prospector). It is EVIDENCE, never authoritative: its presence
// never changes a run's exit_code, output, or isolation. Every string field is
// templated from trusted inputs alone — the profile's route templates, one of four
// HTTP verbs, and a sentence built from those plus numbers — so a finding can
// neither echo a guest id/body/token nor become a prompt-injection channel.
message AdviceFinding {
  string pattern = 1; // detector id: fan_out|repeated_read
  string severity = 2; // info|low|medium|high (advisory ranking only)
  string remedy = 3; // batch|cache
  string method = 4; // route method the finding concerns (GET/PUT/POST/DELETE/PATCH)
  string route = 5; // matched route TEMPLATE, never a raw path
  string detail = 6; // one plain sentence, templated from metadata only
  // suggested_method/suggested_route name the batch route the profile declares for
  // this route (batch_of) and grants: the agent-fixable case. The declaration is the
  // operator's, unchecked by plimsoll. A finding without one is never returned to a
  // caller.
  string suggested_method = 7;
  string suggested_route = 8;
  // The three numbers compare the measured pattern with an assumed ideal of one
  // call; the ideal is never measured. extra_calls is the measured successful call
  // count minus one, counting only calls the broker delivered with a 2xx status
  // (as rigorous as the operator's declaration when suggested_route is set). added_latency_ms is the summed measured
  // round-trip time minus one call's: a model of time spent beyond one call, not wall
  // time lost. bytes_moved is the measured gross bytes the flagged calls moved, not
  // a saving.
  int32 extra_calls = 9;
  int64 added_latency_ms = 10;
  int64 bytes_moved = 11;
}

message RunRequest {
  // protocol is the number the client speaks; see Run. Required: 0 is refused.
  uint32 protocol = 1;
  // Per-run boundary floor. Empty means no request-specific floor; otherwise
  // one of "process", "container", "kernel", or "vm". The server checks its
  // current provider evidence immediately before admission and dispatch.
  string minimum_isolation = 2;
  // trace_id is an OPAQUE correlation id the caller already uses in its own logs
  // (e.g. an id carried across an upstream MCP proxy boundary). plimsoll
  // records it on the run's audit line and does NOTHING else with it: it is never
  // parsed, never routed on, never handed to the guest, and never sent upstream.
  // Its only job is to make plimsoll's metadata-only audit line JOINABLE to the
  // caller's own record of the same request — so "which record did the agent
  // read" stays answerable one layer up, without plimsoll keeping a second copy
  // of the payload to answer it.
  //
  // It is caller-controlled, which makes it the one field here that could smuggle
  // a path or an identifier into a telemetry stream whose entire claim is that it
  // cannot hold one. The server therefore accepts it only as [A-Za-z0-9._:-] up to
  // 64 bytes and DROPS it otherwise, recording that it dropped one. Put nothing
  // meaningful in it: the meaning belongs in the caller's log, not this one.
  string trace_id = 3;
  // Total wall-clock budget in milliseconds for whatever the payload is;
  // optional, defaulted and clamped server-side.
  int32 timeout_ms = 4;
  // Checked by the daemon before dispatch. Older daemons would drop this field,
  // so its addition raises the protocol number.
  SoftwareRule software_rule = 5;
  // prefer_warm lets the daemon run a cell in a sandbox it keeps ready for sessions
  // (DescribeResponse.session_pool): one that has run nothing, with the cell's
  // interpreter already running, claimed for this call alone and deleted after it.
  // When none fits (no pool, none waiting, the session image does not run the
  // language or meet the software rule) the cell runs in a sandbox made for it, as
  // without the flag: a miss is never a refusal. RunResponse.warm says which ran.
  // Only a cell takes it; on any other payload it is InvalidArgument, not dispatched.
  // Older daemons would drop it, so its addition raised the protocol number (5). The
  // request digest does not cover it: it chooses where the cell runs, not what runs.
  bool prefer_warm = 6;
  // Exactly one payload. An empty oneof is InvalidArgument.
  oneof payload {
    JavaScriptRun javascript = 10;
    ProjectRun project = 11;
    ModuleRun module = 12;
    // A cell run by itself keeps nothing: it runs in a sandbox of its own (made for
    // it, or with prefer_warm a waiting pool member), whose interpreter starts with
    // the call and is gone after it, so its result states interpreter_started and
    // interpreter_ended. In a sandbox made for it, the cell runs as a project of one
    // step: its files, the code, and a runner that runs it as a session's interpreter
    // does (its final expression printed); a provider that runs no projects runs a
    // JavaScript cell without files as a snippet. It is also the stored form of a
    // session's cell call (the call without its session ID, with the same request
    // digest), which a harness replays into a fresh session in order.
    CellRun cell = 13;
    // The stored form of a session's file call (the call without its session ID, with
    // the same request digest), which a harness replays into a fresh session in order.
    // Run itself refuses it: a file call is a session call.
    FilesRun files = 14;
  }
}

// JavaScriptRun is a snippet. The engine is provider-dependent (Node on docker
// and e2b, QuickJS on wasm).
message JavaScriptRun {
  string code = 1; // JavaScript source
  // grant_profile names a server-configured host-API capability (see
  // PLIMSOLL_GRANTS_FILE). Empty = fully isolated. The caller can only SELECT a
  // pre-registered profile; BaseURL, allowed routes, and the token live server-side.
  // It lives on the payload, not the envelope, because a module run has no host
  // API and a payload that cannot express a grant beats a rule that refuses one.
  string grant_profile = 2;
}

message RunResponse {
  string sandbox = 1; // which provider ran it (e.g. "docker")
  // isolation is the strength of the boundary the code actually ran behind
  // ("vm", "kernel", "container", "process", "none"), so a caller is never blind
  // to the tier. The provider name alone hides it: "docker" is a real kernel
  // boundary under gVisor but only shared-kernel namespaces under runc. The
  // official client checks this against the request's floor; a mismatch means
  // execution may already have happened and is never a safe retry signal.
  string isolation = 2;
  int64 duration_ms = 3; // wall time of the run as the daemon measured it
  // record is the daemon's statement of this run, for a harness to check and
  // sign (see RunRecord). Every answer carries one, and the official client
  // refuses an answer without it. Nothing a daemon executes depends on it, so
  // it did not move the protocol number.
  RunRecord record = 4;
  // The selected executable image identity, when the provider can establish it.
  // The checked record repeats this field and binds it to the caller's rule.
  string software_identity = 5;
  // Exact outer image or interpreter artifact selected for this run, when
  // stated. The record repeats it so the client checks both statements.
  string environment = 6;
  // The sandbox instance that ran this call, as a typed reference
  // "<kind>:<id>" (for the Kubernetes provider, "k8s-pod-uid:" and the UID the
  // API server gave the pod), or empty when the provider names none. It lets
  // evidence kept outside plimsoll (a runtime's log of the pod) be tied to this
  // run. The record repeats it so the client checks both statements.
  string instance = 7;
  // warm is true when a cell run with prefer_warm ran in a waiting pool member: a
  // sandbox made before the call, which had run only plimsoll's own programs (its
  // interpreters), handed to this call alone and deleted after it. False when the
  // call ran in a sandbox made for it. The record repeats it (from record version 5)
  // so the client checks both statements.
  bool warm = 8;
  // isolation_qualification is the sentence the provider's vendor or design requires to
  // stand beside the tier, as DescribeResponse.isolation_qualification states it, empty
  // for a provider with none (every provider but WSL containers so far). At most 1024
  // bytes of UTF-8 with no control character, no bidirectional control (U+061C, U+200E,
  // U+200F, U+202A to U+202E, U+2066 to U+2069) and no line or paragraph separator
  // (record.ValidQualification). Like the tier it is configuration and
  // provider evidence, never runtime attestation. The record repeats it so the client
  // checks both statements, and every surface that states this answer's tier states it.
  string isolation_qualification = 9;
  // daemon_version is the plimsoll module version of the daemon that answered, from its
  // build information: a release tag such as "v0.28.0", a Go pseudo-version for a build
  // from an untagged commit, or "(devel)" when the build states none; empty when the
  // daemon could read no build information or the version it read is outside that form. The daemon's own statement about itself,
  // like every other field here. The record repeats it so the client checks both.
  string daemon_version = 14;
  // Exactly one result, of the payload's kind.
  oneof result {
    JavaScriptResult javascript = 10;
    ProjectResult project = 11;
    ModuleResult module = 12;
    CellResult cell = 13;
    FilesResult files = 15;
  }
}

// RunRecord states what one run was asked, what it answered, the evidence it
// ran under, and when, as digests a harness outside the daemon can recompute
// from what it sent and received. The daemon holds no key and signs nothing: the
// harness checks the digests and signs the record (a DSSE envelope around an
// in-toto statement), so a key is never one engine escape away from forging
// records. Every digest is lowercase hex SHA-256 over the length-prefixed
// encoding specified in docs/run-records.md, not over this message's bytes, so
// any language can reproduce it without a protobuf or JSON canonicalization
// library.
message RunRecord {
  // version is the encoding version, 5: every field below, every time. A
  // session call that may have run but ended in an error sets unanswered and
  // leaves result_sha256 empty. A live answer must carry this version; a verifier
  // of stored evidence reads every published version (record.published).
  uint32 version = 1;
  // request_sha256 covers what the caller sent: protocol number, floor,
  // timeout, software rule and payload, never the trace id.
  string request_sha256 = 2;
  // result_sha256 covers the result as sent: exit codes or outcome, output,
  // truncation flags, steps, artifacts, module rows; never a duration or advice.
  string result_sha256 = 3;
  string provider = 4; // RunResponse.sandbox
  string isolation = 5; // RunResponse.isolation
  // environment is the exact outer image artifact or interpreter selected.
  string environment = 6;
  string policy = 7; // DescribeResponse.policy
  // When the daemon received the request and when it finished the result.
  int64 started_unix_ms = 8;
  int64 ended_unix_ms = 9;
  // The session fields chain a session's calls; all three are empty or zero for
  // a single run. session is the SHA-256 of the session ID (the ID itself is a
  // capability and is never recorded), sequence counts the session's executed
  // calls from 1, and previous_sha256 is the record_sha256 of the call before.
  string session = 10;
  uint64 sequence = 11;
  string previous_sha256 = 12;
  string software_identity = 14; // RunResponse.software_identity
  string software_rule_id = 15; // exact identity or digest of approved set
  // unanswered, on an unanswered call's record, is the Connect code of the error the call
  // ended with ("unknown", "deadline_exceeded", ...): the daemon's own word, never
  // error text. Empty on an answered call's record.
  string unanswered = 16;
  string instance = 17; // RunResponse.instance
  // From record version 5: RunResponse.isolation_qualification, RunResponse.warm and
  // RunResponse.daemon_version. An unanswered call's record states the qualification
  // the session stated at open, warm false, and the daemon's version.
  string isolation_qualification = 18;
  bool warm = 19;
  string daemon_version = 20;
  // record_sha256 covers every field above.
  string record_sha256 = 13;
}

message JavaScriptResult {
  // stdout/stderr are bytes, not strings: guest programs can emit arbitrary
  // byte sequences, and a protobuf string would repair invalid UTF-8 lossily
  // during serialization. The caller decides how to decode.
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
  bool timed_out = 4;
  // The provider's output cap dropped bytes from the stream. The retained
  // prefix is returned unmarked; these flags are the only truncation signal.
  bool stdout_truncated = 8;
  bool stderr_truncated = 9;
  // advice is a bounded, metadata-only list of efficiency findings. It is present
  // only when the run's grant_profile set advice: caller AND at least one
  // agent-fixable finding exists; it is empty otherwise. Advisory only: this field
  // never changed the run's execution — a run is byte-identical with or without it.
  // Only agent-fixable findings (a batch route the profile declares and grants)
  // appear here; every other finding stays on the operator surface.
  repeated AdviceFinding advice = 10;
}

message ProjectFile {
  string path = 1; // relative path inside the project work dir
  string content = 2;
}

message StepResult {
  string command = 1;
  // bytes for the same reason as JavaScriptResult.stdout: guest output
  // is arbitrary bytes and must not be repaired during serialization.
  bytes stdout = 2;
  bytes stderr = 3;
  int32 exit_code = 4;
  bool timed_out = 5;
  int64 duration_ms = 6;
  // The sandbox's per-step output cap dropped bytes from the stream.
  bool stdout_truncated = 7;
  bool stderr_truncated = 8;
}

// ProjectOutcome types the top-level conclusion of a project run so callers can
// make retry/status decisions without parsing failure strings. Per-step
// failures live in steps; this reports how the RUN concluded.
enum ProjectOutcome {
  PROJECT_OUTCOME_UNSPECIFIED = 0;
  // The runner executed the plan to its normal conclusion (stop on first
  // failing step included); inspect steps for the user's results.
  PROJECT_OUTCOME_COMPLETED = 1;
  // The runner reported a failure before any step began (an illegal file path,
  // an unwritable file): none of the caller's code ran. Safe to retry, though the
  // same request fails the same way.
  PROJECT_OUTCOME_SETUP_FAILED = 2;
  // The outer wall-clock budget expired before the runner reported; steps may
  // be partial or missing.
  PROJECT_OUTCOME_TIMED_OUT = 3;
  // The sandbox produced no parseable result: execution state unknown. Retry
  // only if the project is idempotent.
  PROJECT_OUTCOME_PROTOCOL_ERROR = 4;
  // The runner reported a failure after a step began (an artifact it could not
  // read, a result over the size budget): the caller's code ran, and steps holds
  // the steps it could still report. Retry only if the project is idempotent.
  PROJECT_OUTCOME_RUNNER_FAILED = 5;
}

message Artifact {
  string path = 1;
  bytes content = 2;
}

// ProjectRun writes a multi-file project and runs build/lint/run steps in order.
// ProjectCapable providers structurally support it; callers must still ensure
// their selected image/template contains the required tools.
message ProjectRun {
  repeated ProjectFile files = 1; // written into the work dir before steps run
  repeated string steps = 2; // shell commands run in order; stop on first failure
  repeated string artifacts = 4; // relative file paths to capture and return
  string grant_profile = 5; // server-configured host-API capability; empty = isolated
}

message ProjectResult {
  repeated StepResult steps = 1; // one per step that ran
  // Typed top-level conclusion of the run. Step failures live in steps;
  // pre-dispatch/provider failures use the RPC status instead of this field.
  ProjectOutcome outcome = 3;
  repeated Artifact artifacts = 4; // captured output files (those that existed)
  // Human-readable context for a non-completed outcome; empty when completed.
  string outcome_detail = 6;
  // The aggregate artifact byte budget dropped one or more requested artifacts
  // that existed.
  bool artifacts_truncated = 7;
  // advice mirrors JavaScriptResult.advice for project runs: a bounded,
  // metadata-only list of agent-fixable efficiency findings over the run's brokered
  // host.* calls. Present only when the grant_profile set advice: caller AND at least
  // one agent-fixable finding exists; empty otherwise. Advisory only — a run is
  // byte-identical with or without it; API-change findings stay on the operator surface.
  repeated AdviceFinding advice = 8;
}

// ModuleRow is one parameter set; one fresh model instance is created for it.
// Every row in a request has the same number of values, and that number must
// equal the model's own parameter count, which the worker reads from the module
// itself (a mismatch is a setup_failed outcome, never a silently reshaped row).
message ModuleRow {
  repeated double values = 1;
}

// ModuleRun runs a compiled physical simulator (an AOT-compiled WebAssembly module
// baked into the provider's module image) once per parameter row. No grant: a
// simulator has no host API, and this payload cannot express one.
message ModuleRun {
  // model is an image-relative id ([A-Za-z0-9][A-Za-z0-9._-]{0,63}); the provider
  // maps it to a simulator baked into its module image. A caller can only select a
  // simulator the operator built in: no module, no code, arrives over the wire.
  string model = 1;
  repeated ModuleRow rows = 2;
  double end_time = 3; // simulation horizon, > 0
  double step = 4; // communication step, > 0; end_time / step bounds the step count
}

// ModuleRowResult is one row's result. status is the number of steps the
// instance completed when >= 0, and the model's or worker's negative code when
// that row failed (the worker records the failure and continues with the next
// row). outputs holds width values per completed step, step-major; empty when
// status is not positive.
message ModuleRowResult {
  int32 status = 1;
  repeated double outputs = 2;
}

message ModuleResult {
  repeated ModuleRowResult runs = 1; // one per request row, in order; empty unless outcome is completed
  int32 width = 2; // outputs per step, read from the module
  // Typed top-level conclusion, with the project run's meanings: completed means
  // every row has a result; setup_failed means the worker refused the request
  // (unknown model, malformed table); timed_out and protocol_error as for a
  // project. Pre-dispatch failures use the RPC status instead.
  ProjectOutcome outcome = 5;
  string outcome_detail = 6;
  // The worker's own streams: one summary line on stdout, diagnostics on stderr.
  // Bytes for the same reason as JavaScriptResult.stdout.
  bytes stdout = 7;
  bytes stderr = 8;
}

message OpenSessionRequest {
  uint32 protocol = 1; // see Run
  // The floor for the whole session, checked at open against the provider's
  // evidence. Every call must state at least this floor: a call that omits it or
  // states a weaker one is InvalidArgument, not dispatched. A call may state a
  // stronger floor, checked against the tier measured at open.
  string minimum_isolation = 2;
  string trace_id = 3; // see RunRequest.trace_id
  // Shorter than the daemon's own, or 0 for the daemon's.
  uint32 lifetime_ms = 4;
  uint32 idle_timeout_ms = 5;
  SoftwareRule software_rule = 6;
  // The languages the caller expects its cells to use ("javascript", "python"): a
  // hint. A daemon with a warm pool hands over a sandbox whose interpreters for them
  // are already running, and keeps more of those ready as callers ask for them. It
  // changes latency, never behavior: a cell in any language Describe states still
  // runs, and a language the session environment does not state is dropped from the
  // hint. A language plimsoll does not know is InvalidArgument, not dispatched.
  // Informational, so it did not move the protocol number: a daemon that predates it
  // drops it.
  repeated string languages = 7;
  // The end user the session is for, as an opaque name the caller chooses
  // ([A-Za-z0-9._:-], 1 to 64 characters; anything else is InvalidArgument, not
  // dispatched, since dropping it would lift the cap without a word). A daemon with
  // a per-owner cap (SANDBOX_MAX_SESSIONS_PER_OWNER) counts the caller's sessions
  // per owner; at the cap it closes that owner's least recently used session with no
  // call in progress (its later calls are refused with SESSION_END_REPLACED), or
  // refuses the open, not dispatched, reason capacity, when every one is running a
  // call. Owners of different callers never meet. The official clients send a keyed
  // digest of the user, never the user's name; the daemon never logs it.
  // Informational, so it did not move the protocol number: a daemon that predates it
  // has no per-owner cap, as one with the cap unset.
  string owner = 8;
  // Hand over a waiting pool member or make nothing: an open that finds no member the
  // daemon may hand over is refused, not dispatched, reason capacity, and no sandbox
  // is made (a daemon without a pool refuses every such open). It never closes another
  // session of the owner to make room: at the owner's cap it is refused the same way.
  // For a caller that would rather run fresh than wait for a session's sandbox to be
  // made. A daemon that predates it would ignore it and make the sandbox (on e2b and
  // dockercloud one billed by the second), so it came with protocol 5, which such a
  // daemon refuses before reading the request. A cell for one call needs no session:
  // RunRequest.prefer_warm.
  bool warm_only = 9;
  // Keep no call's answer. By default the daemon keeps, in memory only, the answer to
  // the session's last answered call (the whole RunResponse, its output included) until
  // the next call starts or the session suspends or ends, so that a worker taking the
  // session over across that call's lost answer gets it back
  // (AttachSessionResponse.lost_answer). An answer above the operator's cap
  // (SANDBOX_SESSION_KEPT_ANSWER_BYTES) is not kept. Set this when the caller promises
  // its users that the daemon retains no output; it holds for the whole session and
  // cannot be changed per call. It is no way to keep a secret from the daemon: every
  // answer passes through it.
  bool keep_no_answer = 10;
}

message OpenSessionResponse {
  // session_id is 128 random bits in hex: a capability. Send it only to the
  // daemon; it is never logged or recorded, and records carry its SHA-256.
  string session_id = 1;
  string session = 2; // the SHA-256 of session_id, as records carry it
  string sandbox = 3; // the provider
  string isolation = 4; // the tier measured at open
  int64 expires_unix_ms = 5;
  // After this long without a call the sandbox is suspended; a session no request has
  // named by then is closed instead (SESSION_END_UNCLAIMED).
  uint32 idle_timeout_ms = 6;
  string software_identity = 7; // selected image, when the provider can establish it
  // The sentence the provider states beside the tier at open
  // (RunResponse.isolation_qualification), empty when it states none. An unanswered
  // call's record states this one.
  string isolation_qualification = 8;
  uint64 generation = 9; // positive ownership number; every run and close must carry it
  string minimum_isolation = 10; // floor requested at open; empty means no requested floor
  SoftwareRule software_rule = 11; // immutable rule established at open
  // file_scopes: the scopes in which this session takes file calls
  // (SessionRunRequest.files), carried out by plimsoll's own helper inside its sandbox,
  // in the enum's order; empty when it takes none. Informational, like
  // PayloadEnvironment.file_scopes: the daemon refuses a file call in a scope it does
  // not take, not dispatched, reason unsupported, whatever the client believed. Each
  // call's record names the scope that call used (FilesRun.scope).
  repeated FilesScope file_scopes = 14;
  reserved 12;
  reserved "files";
  // work_dir is the absolute path of the session's work folder inside its sandbox, the
  // folder a file call's WORK scope resolves from and the working directory of every
  // call; empty when the provider states none.
  string work_dir = 13;
}

// SessionCheckpoint is public chain state, never a credential: the ownership
// generation, the count of calls the session has seen and the last one's record
// digest (empty before the first call). The daemon's own is the session's head.
// Applications must protect its integrity separately from conversation history.
message SessionCheckpoint {
  uint64 generation = 1;
  uint64 calls = 2;
  string last_record_sha256 = 3;
}

message AttachSessionRequest {
  uint32 protocol = 1;
  string session = 2; // public lowercase SHA-256 fingerprint, never the secret ID
  SessionCheckpoint checkpoint = 3; // required, including before the first call
  string trace_id = 4;
  // The request digest (RunRecord.request_sha256) of the call the caller believes ran
  // after the checkpoint with no answer reaching it, or empty. With it, a checkpoint
  // exactly one call behind the head is taken over when the session's last record
  // follows the checkpoint and carries this request digest (the "explained gap"); that
  // record comes back in lost_record. Any other difference from the head is still a
  // checkpoint mismatch, and nothing moves.
  string lost_request_sha256 = 5;
}

message AttachSessionResponse {
  // The existing session's identity and immutable policy, with its new generation.
  // session_info.session_id is secret and must remain in memory only.
  OpenSessionResponse session_info = 1;
  SessionCheckpoint checkpoint = 2; // the new head
  // Set only on an attach taken over from a checkpoint one call behind: the record of
  // the call that ran after the checkpoint, which the caller checks against the
  // checkpoint and the digest it named before carrying the chain on.
  RunRecord lost_record = 3;
  // Set only beside lost_record, when the daemon answered that call and still keeps its
  // answer (OpenSessionRequest.keep_no_answer): the answer that never reached the
  // worker which sent the call. The caller believes it only when its record is
  // lost_record and its result digest matches, as for any run answer; an answer that
  // comes unasked, or without lost_record, is refused. Absent when the call ended
  // unanswered (it has no answer), when the answer was above the operator's cap, when
  // the session opened with keep_no_answer, and when a call has started or the session
  // has suspended since.
  RunResponse lost_answer = 4;
}

// SessionHeadMismatch is the error detail of a session call refused because the head
// it stated (SessionRunRequest.head) carries the session's current generation but
// another count or last record digest than the session's. It carries the daemon's
// head, so its owner can tell how far behind or ahead it is. It goes only to the
// current owner: a stale generation is refused without it.
message SessionHeadMismatch {
  SessionCheckpoint head = 1;
}

// SessionRunRequest is a RunRequest with a session ID, for a call in a session.
// It is a separate message so that a daemon that predates sessions refuses it
// (Unimplemented) instead of dropping the ID and running the payload alone. A
// module payload has no session form; a cell exists only in a session. A daemon
// that predates cells drops the cell payload and refuses the request as having
// none, marked not dispatched, so cells did not move the protocol number.
message SessionRunRequest {
  uint32 protocol = 1;
  string minimum_isolation = 2;
  string trace_id = 3;
  int32 timeout_ms = 4;
  string session_id = 5;
  SoftwareRule software_rule = 6;
  // 7 was generation, the ownership number alone; head carries it now, and the
  // number stays reserved so it can never be reused with another meaning.
  reserved 7;
  // The head the caller expects the call to run on: the current ownership generation
  // (OpenSessionResponse.generation, or the one AttachSession returned), the count of
  // calls and the last record digest of the answers it has seen. Under the session's
  // turn, before anything is dispatched, the daemon compares it with its own. A missing
  // head, a zero generation or a malformed count and digest is InvalidArgument; a
  // generation other than the current one is FailedPrecondition, reason permission (a
  // stale owner); a current generation with another count or digest is
  // FailedPrecondition, reason request (a head mismatch: a call ran whose answer this
  // caller has not seen, or the caller counts calls that did not run), with the
  // daemon's head as a SessionHeadMismatch detail. All are not dispatched, and none
  // moves the head. It is not part of the request digest: the record already binds its
  // predecessor.
  SessionCheckpoint head = 8;
  oneof payload {
    JavaScriptRun javascript = 10;
    ProjectRun project = 11;
    CellRun cell = 12;
    // One operation on the session's files, carried out inside the sandbox by
    // plimsoll's own helper (from protocol 9). A daemon whose session carries no file
    // calls refuses it, marked not dispatched, reason unsupported.
    FilesRun files = 13;
  }
}

// CellRun is one call to the session's interpreter for its language. The session
// keeps one interpreter per language alive between calls, so what a cell defines is
// there for the next cell, as in a notebook. The files are written into the
// session's work directory, the interpreter's working directory, before the code
// runs. A cell carries no grant: its interpreter outlives the call, and a grant
// lives for one call.
message CellRun {
  string language = 1; // "javascript" or "python"; see PayloadEnvironment.languages
  string code = 2;
  repeated ProjectFile files = 3;
}

// CellResult is a cell's outcome. exit_code is 0 when the code ran without raising,
// 1 when it raised (the error is on stderr), and 124 when the call's deadline ended
// it. A final expression's value is printed to stdout, as a notebook shows it.
message CellResult {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
  bool timed_out = 4;
  bool stdout_truncated = 5;
  bool stderr_truncated = 6;
  // This call started a fresh interpreter: nothing an earlier cell defined exists.
  bool interpreter_started = 7;
  // The interpreter ended during this call (the code exited it, it was killed, or the
  // deadline passed); the next cell starts a fresh one.
  bool interpreter_ended = 8;
}

// FilesRun is one operation on a session's files (a session call kind, from protocol 9),
// carried out inside the sandbox by plimsoll's own helper as the guest's own user. Every
// path is bytes: a name may hold any byte but "/" and NUL, which is not always UTF-8, so a
// name a listing returns can be named back by the same bytes. docs/run-records.md gives
// the request digest's fields.
message FilesRun {
  FilesScope scope = 1;
  // Exactly one operation. An empty oneof is InvalidArgument.
  oneof op {
    FilesStat stat = 10;
    FilesRead read = 11;
    FilesWrite write = 12;
    FilesList list = 13;
    FilesReadMany read_many = 14;
    FilesMakeDir make_dir = 15;
    FilesRemove remove = 16;
    FilesRename rename = 17;
  }
}

// FilesScope says how a file call's paths resolve.
enum FilesScope {
  FILES_SCOPE_UNSPECIFIED = 0; // refused, InvalidArgument
  // A relative path from the session's work folder, parts separated by "/", none empty,
  // "." or "..", at most 4096 bytes; "." alone is the work folder. A link that stays
  // inside the work folder is followed and one that would leave it is refused with
  // FILES_ERROR_SYMLINK, by the kernel's own resolution (docs/session-files.md has the
  // table per operation).
  FILES_SCOPE_WORK = 1;
  // An absolute path resolved as the guest's own user would resolve it, links followed.
  // The sandbox's walls are the boundary.
  FILES_SCOPE_SANDBOX = 2;
}

// FilesStat states one path's type, size and permission bits.
message FilesStat {
  bytes path = 1;
}

// FilesRead reads at most max_bytes (1 to 8 MiB) of one file, from offset.
message FilesRead {
  bytes path = 1;
  uint64 offset = 2;
  uint32 max_bytes = 3;
}

// FilesWrite writes one file of at most 4 MiB. replace and create_only write a file of
// the helper's own, sync it and publish it whole at the target, so a reader never sees
// part of it; append is not atomic: after a call that may have run, the file may have
// grown. A call that gave no answer is never retried by a client (docs/session-files.md
// says per operation what one may have left).
message FilesWrite {
  bytes path = 1;
  bytes content = 2;
  FilesWriteMode mode = 3;
  bool make_parents = 4; // make the folders above path that are missing
}

enum FilesWriteMode {
  FILES_WRITE_MODE_UNSPECIFIED = 0; // refused, InvalidArgument
  FILES_WRITE_MODE_REPLACE = 1; // the file's whole content becomes content
  FILES_WRITE_MODE_CREATE_ONLY = 2; // refused with FILES_ERROR_EXISTS if path is there
  FILES_WRITE_MODE_APPEND = 3; // content goes after the file's end
}

// FilesList lists a folder, one page at a time: entries sorted by their bytes, folders
// depth first, until budget_bytes (8 KiB to 8 MiB) ends the page (FilesListAnswer.more), a
// page that ends with more always holding an entry.
// A listing is not isolated from changes made while it pages.
message FilesList {
  bytes path = 1; // the folder
  bool recursive = 2;
  // A glob matched part by part: "*", "?" and "[...]" within one part, "**" as a whole
  // part for zero or more parts, a leading dot not special. Empty lists every entry.
  bytes match = 3;
  bytes after = 4; // the last path of the page before; empty for the first page
  uint32 budget_bytes = 5;
}

// FilesReadMany reads at most 16,384 files in order, each up to max_bytes_each, until
// budget_bytes ends the answer (FilesReadManyAnswer.more). One file's error does not
// fail the call.
message FilesReadMany {
  repeated bytes paths = 1;
  uint32 max_bytes_each = 2;
  uint32 budget_bytes = 3;
}

message FilesMakeDir {
  bytes path = 1;
  bool parents = 2; // make the folders above it that are missing, and accept one already there
}

// FilesRemove removes one file, or with dir one empty folder. There is no recursive
// remove: an agent's shell has one.
message FilesRemove {
  bytes path = 1;
  bool dir = 2;
}

// FilesRename renames from_path to to_path, replacing a file already at to_path only
// with replace.
message FilesRename {
  bytes from_path = 1;
  bytes to_path = 2;
  bool replace = 3;
}

// FilesResult is a file call's answer. A file that is not there is an answered result
// with FILES_ERROR_NOT_FOUND, as a nonzero exit is, not a transport error. No answer
// carries free text from inside the sandbox. docs/run-records.md gives the result
// digest's fields.
message FilesResult {
  // completed: the helper answered (error then says whether the operation succeeded);
  // timed_out: the call's deadline passed; protocol_error: the helper's answer could not
  // be parsed; runner_failed: the helper ended without one.
  ProjectOutcome outcome = 1;
  FilesError error = 2; // FILES_ERROR_UNSPECIFIED when the operation succeeded
  string errno = 3; // the errno name the error came from, such as ENOENT; empty with none
  // The operation's answer, which names the operation it answers; none with an error or
  // an outcome other than completed.
  oneof answer {
    FilesStatAnswer stat = 10;
    FilesReadAnswer read = 11;
    FilesWriteAnswer write = 12;
    FilesListAnswer list = 13;
    FilesReadManyAnswer read_many = 14;
    FilesDone make_dir = 15;
    FilesDone remove = 16;
    FilesDone rename = 17;
  }
}

// FilesError is the closed set of a file call's errors.
enum FilesError {
  FILES_ERROR_UNSPECIFIED = 0; // no error
  FILES_ERROR_NOT_FOUND = 1;
  FILES_ERROR_IS_DIR = 2;
  FILES_ERROR_NOT_DIR = 3;
  FILES_ERROR_EXISTS = 4;
  FILES_ERROR_SYMLINK = 5; // a link where the WORK scope follows none
  FILES_ERROR_NOT_REGULAR = 6; // a pipe, a device or a socket where a file was asked for
  FILES_ERROR_PERMISSION_DENIED = 7;
  FILES_ERROR_TOO_LARGE = 8;
  FILES_ERROR_NO_SPACE = 9;
  FILES_ERROR_READ_ONLY = 10;
  FILES_ERROR_NOT_EMPTY = 11;
  // A listing passed one of its bounds before it filled its page: the entries one call may
  // read, the names it may hold, the depth below the folder, or a path's 4096 bytes.
  FILES_ERROR_SCAN_LIMIT = 12;
  FILES_ERROR_OTHER = 13;
}

enum FilesEntryType {
  FILES_ENTRY_TYPE_UNSPECIFIED = 0;
  FILES_ENTRY_TYPE_FILE = 1;
  FILES_ENTRY_TYPE_DIR = 2;
  FILES_ENTRY_TYPE_LINK = 3; // a symbolic link, named as a link and never followed
  FILES_ENTRY_TYPE_OTHER = 4;
  // A folder a recursive listing could not enter: the guest may not read or search it. Its
  // entries are not listed, and the listing goes on after it. Only a recursive listing's
  // entry has this type, never a stat's answer.
  FILES_ENTRY_TYPE_UNREADABLE = 5;
}

message FilesStatAnswer {
  FilesEntryType type = 1;
  uint64 size = 2;
  uint32 mode = 3; // the permission bits
}

message FilesReadAnswer {
  bytes content = 1;
  // The file's size as the read's open saw it: no promise of its length at any later
  // moment. A reader of many pieces checks each piece against its own answer; stat gives
  // the current length.
  uint64 size_at_open = 2;
}

message FilesWriteAnswer {
  uint64 written = 1;
}

message FilesEntry {
  bytes path = 1; // from the listed folder
  FilesEntryType type = 2;
  uint64 size = 3;
}

message FilesListAnswer {
  repeated FilesEntry entries = 1;
  bool more = 2; // the budget ended the page: ask again with after set to the last path
}

// FilesReadManyItem is one path's answer, in the order the paths were asked: its bytes,
// or its error.
message FilesReadManyItem {
  FilesError error = 1;
  string errno = 2;
  bytes content = 3;
  uint64 size_at_open = 4;
}

message FilesReadManyAnswer {
  repeated FilesReadManyItem items = 1;
  bool more = 2; // the next path's answer did not fit the budget
}

// FilesDone answers an operation that returns nothing: make_dir, remove, rename.
message FilesDone {}

message SessionRunResponse {
  RunResponse run = 1; // its record carries the session's chain fields
  // Set when the session ended during or after this call (its lifetime passed,
  // its disk budget was exceeded, its sandbox's main process ended, or the
  // boundary between calls could not be established); later calls are refused.
  SessionEnd ended = 2;
  string end_detail = 3;
}

message CloseSessionRequest {
  uint32 protocol = 1;
  string session_id = 2;
  // The current ownership number, checked as SessionRunRequest.head's generation is,
  // before anything of the session is closed. A close needs no head: it runs nothing.
  uint64 generation = 3;
}

message CloseSessionResponse {
  string session = 1; // the fingerprint
  // The calls the session executed and returned, with the last one's
  // record_sha256 (empty when there were none).
  uint64 calls = 2;
  string last_record_sha256 = 3;
  // Why the session ended: CLOSED for this request, or an earlier end.
  SessionEnd ended = 4;
}

// SessionEnd says why a session ended.
enum SessionEnd {
  SESSION_END_UNSPECIFIED = 0; // not ended
  SESSION_END_CLOSED = 1;
  SESSION_END_EXPIRED = 2;
  SESSION_END_DISK_EXCEEDED = 3;
  SESSION_END_MAIN_PROCESS_ENDED = 4;
  SESSION_END_BOUNDARY_FAILED = 5;
  SESSION_END_SANDBOX_CHANGED = 6;
  SESSION_END_SHUTDOWN = 7;
  // The daemon closed it, between calls, to open a newer session for the same
  // owner (OpenSessionRequest.owner), which was at the daemon's per-owner cap.
  SESSION_END_REPLACED = 8;
  // The daemon has no such session for this caller: it restarted and forgot it, or
  // the ID is not this caller's (both get the same answer, so it says nothing about an
  // ID's existence). Nothing of the call ran; a client opens a new session.
  SESSION_END_NOT_FOUND = 9;
  // No request named the session before its first idle timeout (5 minutes when it
  // never suspends), so the daemon closed it: the answer to its open never reached the
  // client, which then can neither use nor close it, or the client opened it ahead of
  // calls that did not come in time; the daemon cannot tell which. Nothing ran in it.
  SESSION_END_UNCLAIMED = 10;
}

// SessionEnded is attached as an error detail to a SessionRun refused because
// its session has ended; it carries NotDispatched too, since nothing ran.
message SessionEnded {
  SessionEnd reason = 1;
  string detail = 2;
}

// NotDispatched is attached as an error detail to any procedure's error that
// was raised before any code was dispatched: nothing executed, so retrying the
// request or sending it to another daemon cannot run it twice. Only refusals that
// provably ran nothing carry it. An error WITHOUT this detail may have followed
// execution, whatever its status code, and is never a safe automatic-retry signal.
message NotDispatched {
  NotDispatchedReason reason = 1;
  // On a capacity refusal, which limit shed it, so a caller can tell a limit that
  // closing one of its own sessions frees from one that no close cures. Unspecified
  // on every other reason, and on a capacity refusal from a daemon that does not
  // state it. Field 3, not 2: the Python client before it read a NotDispatched as
  // SessionEnded's shape, an enum then a string, and drops the whole mark when field 2
  // is a number, so a limit there would read as "may have run" to it.
  CapacityLimit limit = 3;
  reserved 2;
}

// CapacityLimit names the limit a capacity refusal met. A caller acts on it; the
// refusal's text is for people.
enum CapacityLimit {
  // Not stated: not a capacity refusal, or a daemon that does not state the limit.
  CAPACITY_LIMIT_UNSPECIFIED = 0;
  // The daemon's session places are all taken (SANDBOX_MAX_SESSIONS). Closing one
  // of the caller's sessions frees one.
  CAPACITY_LIMIT_SESSIONS = 1;
  // The caller holds as many sessions as one caller may
  // (SANDBOX_MAX_SESSIONS_PER_CALLER). Closing one of them frees one.
  CAPACITY_LIMIT_CALLER_SESSIONS = 2;
  // The open's owner is at its cap (SANDBOX_MAX_SESSIONS_PER_OWNER) and the daemon
  // could close none of that owner's sessions for it: each is running a call, or the
  // open was warm-only. The daemon already closes an owner's idle session to make
  // room, so a close by the caller frees nothing more.
  CAPACITY_LIMIT_OWNER_SESSIONS = 3;
  // The daemon's runs in flight are at their cap (SANDBOX_MAX_CONCURRENT). A running
  // session holds one, so closing one may free one.
  CAPACITY_LIMIT_RUNS = 4;
  // The caller's runs in flight are at their cap (SANDBOX_PER_KEY_CONCURRENT). A
  // running session holds one, so closing one may free one.
  CAPACITY_LIMIT_CALLER_RUNS = 5;
  // The caller's runs per minute are spent (SANDBOX_RATE_PER_MIN). Only time gives
  // them back; no close does.
  CAPACITY_LIMIT_RATE = 6;
  // The paid seconds for today are spent, the caller's or the daemon's
  // (SANDBOX_PAID_SECONDS_PER_DAY), until 00:00 UTC.
  CAPACITY_LIMIT_PAID_SECONDS = 7;
  // A short line is full: the requests the daemon decodes at once, the calls waiting
  // for the ship scan, or a call already waiting for its session's turn. Retry shortly.
  CAPACITY_LIMIT_QUEUE = 8;
  // The provider shed it by its own capacity: a quota, a warm pool with no sandbox
  // waiting, a provider shutting down.
  CAPACITY_LIMIT_PROVIDER = 9;
  // The call's own time ran out before any of it was sent: its deadline passed, or its
  // caller canceled it, while it waited for its session's turn or a place, or while the
  // sandbox, its grant or the provider's checks were made ready for it. No limit of the
  // daemon's or the provider's was met, and no close frees anything; a retry with more
  // time may succeed. The refusal's code is the context's: deadline_exceeded or canceled.
  CAPACITY_LIMIT_DEADLINE = 10;
}

// UnansweredCall is the error detail of a session call that may have run but ended
// in an error (an error without NotDispatched): its run record (the current version), which the
// session's chain counts, so a call that ran is never missing from the chain.
message UnansweredCall {
  RunRecord record = 1;
}

// NotDispatchedReason says why, in the terms a caller acts on: whether another
// daemon could take the same request.
enum NotDispatchedReason {
  NOT_DISPATCHED_REASON_UNSPECIFIED = 0;
  // Malformed or out of bounds. Every daemon refuses it the same way.
  NOT_DISPATCHED_REASON_REQUEST = 1;
  // Authentication, scope, or a grant profile's caller list; or the run's grant
  // could not be issued (an invalid grant, a failed mint). Do not reselect.
  NOT_DISPATCHED_REASON_PERMISSION = 2;
  // The daemon serves another protocol number.
  NOT_DISPATCHED_REASON_PROTOCOL = 3;
  // This daemon's provider cannot perform the operation, or is disabled.
  NOT_DISPATCHED_REASON_UNSUPPORTED = 4;
  // The provider's current isolation evidence is below the request's floor.
  NOT_DISPATCHED_REASON_ISOLATION = 5;
  // Shed by admission or a rate limit; retry later or elsewhere.
  NOT_DISPATCHED_REASON_CAPACITY = 6;
  // The selected software cannot meet the caller's rule, or the sandbox a call
  // was to run in could not be shown to be the one stated (an interpreter that
  // could not start, a session's read-back that failed).
  NOT_DISPATCHED_REASON_ENVIRONMENT = 7;
}
