syntax = "proto3";

// Package plimsoll.v1 is the RPC surface of the standalone code-execution
// sandbox. It mirrors the transport-agnostic sandbox.Sandbox interface so any
// provider (wasm, docker/gVisor, e2b) can back it. Callers reach it over
// Connect/gRPC; access requires the "code:run" scope.
package plimsoll.v1;

option go_package = "github.com/plimsollmark/plimsoll/gen/go/plimsoll/v1;plimsollv1";

// SandboxService runs untrusted, agent-authored code in an isolated runtime.
service SandboxService {
  // Run executes exactly one operation: a JavaScript snippet, a multi-file
  // project, or a compiled simulator over a parameter table. The request is an
  // envelope (protocol number, isolation floor, trace id, timeout) around a
  // oneof payload; the response is an envelope (provider, isolation evidence,
  // duration) around the matching result. One procedure, one scope, one place
  // where the floor is checked before admission and dispatch.
  //
  // The protocol number is the mixed-version gate. Protobuf drops fields a
  // receiver does not know, so a daemon that predates a security-relevant
  // request field (a floor, a limit, a capability restriction) would execute the
  // request without it. A client therefore states the protocol it speaks and a
  // daemon serves exactly one: a request that omits it is InvalidArgument and a
  // request on any other number is Unimplemented, in both cases before the
  // payload is read. The number is bumped when such a field is added; an
  // informational field does not bump it. Current number: 2 (the Go constant
  // protocol.Number, which Describe reports).
  rpc Run(RunRequest) returns (RunResponse);
  // Describe reports the protocol number, the active provider, current isolation
  // evidence, and static operation support. Project and module support are
  // structural: they do not prove that the selected image/template contains a
  // particular toolchain or model.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  // OpenSession starts a session: one sandbox kept for many calls, in which files
  // a call writes persist for later calls and no process a call starts outlives
  // it. The session belongs to the principal that opened it; its ID is a
  // capability that only that principal can use. Each request states the
  // protocol number and gets Run's check. A daemon without sessions answers
  // Unimplemented, marked not dispatched.
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  // SessionRun runs one call in an open session. Its record is chained to the
  // session's previous call (RunRecord's session fields).
  rpc SessionRun(SessionRunRequest) returns (SessionRunResponse);
  // CloseSession ends a session, or collects the end of one that ended by
  // itself, and states how many calls it executed and the last record's digest,
  // which a harness signs so a cut chain is told from a complete one.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // 6 was supports_minimum_isolation and 7 was supports_advisory: feature bits
  // whose only reading was "an older server omits them". The protocol number is
  // the one statement of what this daemon speaks; the numbers stay reserved so
  // they can never be reused with another meaning.
  reserved 6, 7;
  string sandbox = 1; // active provider id (e.g. "docker")
  // isolation is the provider's boundary tier ("vm", "kernel", "container",
  // "process", "none") — see RunResponse.isolation.
  string isolation = 2;
  bool supports_project = 3; // whether a project payload works on this provider
  // Grant support is operation-specific. A provider may support isolated project
  // runs while only having a credential-safe broker for JavaScript snippets.
  bool supports_javascript_grants = 4;
  bool supports_project_grants = 5;
  // Whether a module payload works on this provider: a module image is configured
  // and the provider can supervise its worker. Static discovery, like supports_project.
  bool supports_module = 8;
  // The protocol number this daemon serves (see Run). A client compares it with
  // its own before relying on this daemon; Run checks it again on every request.
  uint32 protocol = 9;
  // What this daemon states about where each payload kind runs, and the per-run
  // resource envelope. Informational, like the tier: configuration and provider
  // evidence, never runtime attestation, and nothing in Run reads them. A router
  // uses them so that two backends with the same tier are not taken for the
  // same environment.
  PayloadEnvironment javascript_environment = 10;
  PayloadEnvironment project_environment = 11;
  PayloadEnvironment module_environment = 12;
  RunResources resources = 13;
  // policy names the sandbox policy the provider verifies before every run, by a
  // content digest prefixed with how it was derived ("openshell-policy:sha256:",
  // the digest OpenShell's gateway itself reports for a policy). Empty when the
  // provider has no such object. Informational, like the environments.
  string policy = 14;
  // Whether OpenSession works here: the provider keeps sessions and the operator
  // enabled them. The lifetime and idle timeout are the daemon's; a request may
  // ask for shorter ones.
  bool supports_sessions = 15;
  uint32 session_lifetime_ms = 16;
  uint32 session_idle_timeout_ms = 17;
}

// PayloadEnvironment is one payload kind's environment as the daemon states it.
message PayloadEnvironment {
  // identity names the exact outer image artifact or embedded interpreter, set
  // only when content-addressed. An OCI index can change when attached build
  // metadata changes, even when its selected executable manifest does not.
  // A mutable name (a tag or template name) is never sent.
  string identity = 1;
  // max_timeout_ms is the longest one run of this kind may take on this daemon
  // (the provider's ceiling, capped by the daemon's own). 0 = the kind is
  // unsupported or no ceiling is stated.
  uint32 max_timeout_ms = 2;
  // Selected executable image manifest and platform, separate from the outer
  // index in identity. Empty means the provider cannot establish it.
  string software_identity = 3;
  // The languages this environment's interpreters run, as the provider's startup
  // checks proved them ("javascript", "python"): the languages a project's steps can
  // invoke, and on a provider with sessions the languages a cell may use. Empty when
  // the provider has proved none.
  repeated string languages = 4;
}

// An explicit caller rule for the selected software. Empty mode and identities
// impose no rule. "exact" takes one identity; "approved" takes 1 to 32,
// bounding the caller-controlled list to about 8 KiB at 256 bytes per identity.
message SoftwareRule {
  string mode = 1;
  repeated string identities = 2;
}

// RunResources is the per-run resource envelope the operator configured. Each
// provider refuses to start with a dimension it cannot enforce, so a non-zero
// value is enforced; 0 means the provider's default, which is not stated here.
message RunResources {
  uint32 memory_mb = 1;
  double cpus = 2;
  uint32 pids = 3;
  // disk_mb is the run's writable-storage budget (on docker, the aggregate of
  // every writable mount).
  uint32 disk_mb = 4;
}

// AdviceFinding is one metadata-only efficiency observation about a run's brokered
// host.* calls (Prospector). It is EVIDENCE, never authoritative: its presence
// never changes a run's exit_code, output, or isolation. Every string field is
// templated from trusted inputs alone — the profile's route templates, one of four
// HTTP verbs, and a sentence built from those plus numbers — so a finding can
// neither echo a guest id/body/token nor become a prompt-injection channel.
message AdviceFinding {
  string pattern = 1; // detector id: fan_out|repeated_read
  string severity = 2; // info|low|medium|high (advisory ranking only)
  string remedy = 3; // batch|cache
  string method = 4; // route method the finding concerns (GET/PUT/POST/DELETE/PATCH)
  string route = 5; // matched route TEMPLATE, never a raw path
  string detail = 6; // one plain sentence, templated from metadata only
  // suggested_method/suggested_route name a better route the profile already
  // exposes (the agent-fixable case). Both empty means no better endpoint exists,
  // so the fix is an API change and this finding is never returned to a caller.
  string suggested_method = 7;
  string suggested_route = 8;
  // The three numbers compare the measured pattern with an assumed ideal of one
  // call; the ideal is never measured. extra_calls is the measured successful call
  // count minus one, counting only calls the broker delivered with a 2xx status
  // (rigorous when suggested_route is set). added_latency_ms is the summed measured
  // round-trip time minus one call's: a model of time spent beyond one call, not wall
  // time lost. bytes_moved is the measured gross bytes the flagged calls moved, not
  // a saving.
  int32 extra_calls = 9;
  int64 added_latency_ms = 10;
  int64 bytes_moved = 11;
}

message RunRequest {
  // protocol is the number the client speaks; see Run. Required: 0 is refused.
  uint32 protocol = 1;
  // Per-run boundary floor. Empty means no request-specific floor; otherwise
  // one of "process", "container", "kernel", or "vm". The server checks its
  // current provider evidence immediately before admission and dispatch.
  string minimum_isolation = 2;
  // trace_id is an OPAQUE correlation id the caller already uses in its own logs
  // (e.g. an id carried across an upstream MCP proxy boundary). plimsoll
  // records it on the run's audit line and does NOTHING else with it: it is never
  // parsed, never routed on, never handed to the guest, and never sent upstream.
  // Its only job is to make plimsoll's metadata-only audit line JOINABLE to the
  // caller's own record of the same request — so "which record did the agent
  // read" stays answerable one layer up, without plimsoll keeping a second copy
  // of the payload to answer it.
  //
  // It is caller-controlled, which makes it the one field here that could smuggle
  // a path or an identifier into a telemetry stream whose entire claim is that it
  // cannot hold one. The server therefore accepts it only as [A-Za-z0-9._:-] up to
  // 64 bytes and DROPS it otherwise, recording that it dropped one. Put nothing
  // meaningful in it: the meaning belongs in the caller's log, not this one.
  string trace_id = 3;
  // Total wall-clock budget in milliseconds for whatever the payload is;
  // optional, defaulted and clamped server-side.
  int32 timeout_ms = 4;
  // Checked by the daemon before dispatch. Older daemons would drop this field,
  // so its addition raises the protocol number.
  SoftwareRule software_rule = 5;
  // Exactly one payload. An empty oneof is InvalidArgument.
  oneof payload {
    JavaScriptRun javascript = 10;
    ProjectRun project = 11;
    ModuleRun module = 12;
    // A cell runs only in a session, so Run refuses it, marked not dispatched. It
    // is here as the stored form of a session's cell call (the call without its
    // session ID, with the same request digest), which a harness signs and replays
    // into a fresh session in order.
    CellRun cell = 13;
  }
}

// JavaScriptRun is a snippet. The engine is provider-dependent (Node on docker
// and e2b, QuickJS on wasm).
message JavaScriptRun {
  string code = 1; // JavaScript source
  // grant_profile names a server-configured host-API capability (see
  // PLIMSOLL_GRANTS_FILE). Empty = fully isolated. The caller can only SELECT a
  // pre-registered profile; BaseURL, allowed routes, and the token live server-side.
  // It lives on the payload, not the envelope, because a module run has no host
  // API and a payload that cannot express a grant beats a rule that refuses one.
  string grant_profile = 2;
}

message RunResponse {
  string sandbox = 1; // which provider ran it (e.g. "docker")
  // isolation is the strength of the boundary the code actually ran behind
  // ("vm", "kernel", "container", "process", "none"), so a caller is never blind
  // to the tier. The provider name alone hides it: "docker" is a real kernel
  // boundary under gVisor but only shared-kernel namespaces under runc. The
  // official client checks this against the request's floor; a mismatch means
  // execution may already have happened and is never a safe retry signal.
  string isolation = 2;
  int64 duration_ms = 3; // wall time of the run as the daemon measured it
  // record is the daemon's statement of this run, for a harness to check and
  // sign (see RunRecord). Every answer carries one, and the official client
  // refuses an answer without it. Nothing a daemon executes depends on it, so
  // it did not move the protocol number.
  RunRecord record = 4;
  // The selected executable image identity, when the provider can establish it.
  // The checked record repeats this field and binds it to the caller's rule.
  string software_identity = 5;
  // Exact outer image or interpreter artifact selected for this run, when
  // stated. The record repeats it so the client checks both statements.
  string environment = 6;
  // Exactly one result, of the payload's kind.
  oneof result {
    JavaScriptResult javascript = 10;
    ProjectResult project = 11;
    ModuleResult module = 12;
    CellResult cell = 13;
  }
}

// RunRecord states what one run was asked, what it answered, the evidence it
// ran under, and when, as digests a harness outside the daemon can recompute
// from what it sent and received. The daemon holds no key and signs nothing: the
// harness checks the digests and signs the record (a DSSE envelope around an
// in-toto statement), so a key is never one engine escape away from forging
// records. Every digest is lowercase hex SHA-256 over the length-prefixed
// encoding specified in docs/run-records.md, not over this message's bytes, so
// any language can reproduce it without a protobuf or JSON canonicalization
// library.
message RunRecord {
  // version is the encoding version: 2 for a call that was answered, 3 for a
  // session call that may have run but ended in an error (unanswered is set and
  // result_sha256 is empty). Version 1 remains verifiable. A verifier refuses an
  // unknown version.
  uint32 version = 1;
  // request_sha256 covers what the caller sent: protocol number, floor,
  // timeout, software rule and payload, never the trace id.
  string request_sha256 = 2;
  // result_sha256 covers the result as sent: exit codes or outcome, output,
  // truncation flags, steps, artifacts, module rows; never a duration or advice.
  string result_sha256 = 3;
  string provider = 4; // RunResponse.sandbox
  string isolation = 5; // RunResponse.isolation
  // environment is the exact outer image artifact or interpreter selected.
  string environment = 6;
  string policy = 7; // DescribeResponse.policy
  // When the daemon received the request and when it finished the result.
  int64 started_unix_ms = 8;
  int64 ended_unix_ms = 9;
  // The session fields chain a session's calls; all three are empty or zero for
  // a single run. session is the SHA-256 of the session ID (the ID itself is a
  // capability and is never recorded), sequence counts the session's executed
  // calls from 1, and previous_sha256 is the record_sha256 of the call before.
  string session = 10;
  uint64 sequence = 11;
  string previous_sha256 = 12;
  string software_identity = 14; // RunResponse.software_identity
  string software_rule_id = 15; // exact identity or digest of approved set
  // unanswered, on a version 3 record, is the Connect code of the error the call
  // ended with ("unknown", "deadline_exceeded", ...): the daemon's own word, never
  // error text. Empty on an answered call's record.
  string unanswered = 16;
  // record_sha256 covers every field above.
  string record_sha256 = 13;
}

message JavaScriptResult {
  // stdout/stderr are bytes, not strings: guest programs can emit arbitrary
  // byte sequences, and a protobuf string would repair invalid UTF-8 lossily
  // during serialization. The caller decides how to decode.
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
  bool timed_out = 4;
  // The provider's output cap dropped bytes from the stream. The retained
  // prefix is returned unmarked; these flags are the only truncation signal.
  bool stdout_truncated = 8;
  bool stderr_truncated = 9;
  // advice is a bounded, metadata-only list of efficiency findings. It is present
  // only when the run's grant_profile set advice: caller AND at least one
  // agent-fixable finding exists; it is empty otherwise. Advisory only: this field
  // never changed the run's execution — a run is byte-identical with or without it.
  // Only agent-fixable findings (a better route the profile exposes) appear here;
  // API-change findings stay on the operator surface.
  repeated AdviceFinding advice = 10;
}

message ProjectFile {
  string path = 1; // relative path inside the project work dir
  string content = 2;
}

message StepResult {
  string command = 1;
  // bytes for the same reason as JavaScriptResult.stdout: guest output
  // is arbitrary bytes and must not be repaired during serialization.
  bytes stdout = 2;
  bytes stderr = 3;
  int32 exit_code = 4;
  bool timed_out = 5;
  int64 duration_ms = 6;
  // The sandbox's per-step output cap dropped bytes from the stream.
  bool stdout_truncated = 7;
  bool stderr_truncated = 8;
}

// ProjectOutcome types the top-level conclusion of a project run so callers can
// make retry/status decisions without parsing failure strings. Per-step
// failures live in steps; this reports how the RUN concluded.
enum ProjectOutcome {
  PROJECT_OUTCOME_UNSPECIFIED = 0;
  // The runner executed the plan to its normal conclusion (stop on first
  // failing step included); inspect steps for the user's results.
  PROJECT_OUTCOME_COMPLETED = 1;
  // The run failed around step execution for a request-attributable reason the
  // runner reported (illegal file path, unwritable file, over-budget result).
  // Retrying the same request will fail again.
  PROJECT_OUTCOME_SETUP_FAILED = 2;
  // The outer wall-clock budget expired before the runner reported; steps may
  // be partial or missing.
  PROJECT_OUTCOME_TIMED_OUT = 3;
  // The sandbox produced no parseable result: execution state unknown. Retry
  // only if the project is idempotent.
  PROJECT_OUTCOME_PROTOCOL_ERROR = 4;
}

message Artifact {
  string path = 1;
  bytes content = 2;
}

// ProjectRun writes a multi-file project and runs build/lint/run steps in order.
// ProjectCapable providers structurally support it; callers must still ensure
// their selected image/template contains the required tools.
message ProjectRun {
  repeated ProjectFile files = 1; // written into the work dir before steps run
  repeated string steps = 2; // shell commands run in order; stop on first failure
  repeated string artifacts = 4; // relative file paths to capture and return
  string grant_profile = 5; // server-configured host-API capability; empty = isolated
}

message ProjectResult {
  repeated StepResult steps = 1; // one per step that ran
  // Typed top-level conclusion of the run. Step failures live in steps;
  // pre-dispatch/provider failures use the RPC status instead of this field.
  ProjectOutcome outcome = 3;
  repeated Artifact artifacts = 4; // captured output files (those that existed)
  // Human-readable context for a non-completed outcome; empty when completed.
  string outcome_detail = 6;
  // The aggregate artifact byte budget dropped one or more requested artifacts
  // that existed.
  bool artifacts_truncated = 7;
  // advice mirrors JavaScriptResult.advice for project runs: a bounded,
  // metadata-only list of agent-fixable efficiency findings over the run's brokered
  // host.* calls. Present only when the grant_profile set advice: caller AND at least
  // one agent-fixable finding exists; empty otherwise. Advisory only — a run is
  // byte-identical with or without it; API-change findings stay on the operator surface.
  repeated AdviceFinding advice = 8;
}

// ModuleRow is one parameter set; one fresh model instance is created for it.
// Every row in a request has the same number of values, and that number must
// equal the model's own parameter count, which the worker reads from the module
// itself (a mismatch is a setup_failed outcome, never a silently reshaped row).
message ModuleRow {
  repeated double values = 1;
}

// ModuleRun runs a compiled physical simulator (an AOT-compiled WebAssembly module
// baked into the provider's module image) once per parameter row. No grant: a
// simulator has no host API, and this payload cannot express one.
message ModuleRun {
  // model is an image-relative id ([A-Za-z0-9][A-Za-z0-9._-]{0,63}); the provider
  // maps it to a simulator baked into its module image. A caller can only select a
  // simulator the operator built in: no module, no code, arrives over the wire.
  string model = 1;
  repeated ModuleRow rows = 2;
  double end_time = 3; // simulation horizon, > 0
  double step = 4; // communication step, > 0; end_time / step bounds the step count
}

// ModuleRowResult is one row's result. status is the number of steps the
// instance completed when >= 0, and the model's or worker's negative code when
// that row failed (the worker records the failure and continues with the next
// row). outputs holds width values per completed step, step-major; empty when
// status is not positive.
message ModuleRowResult {
  int32 status = 1;
  repeated double outputs = 2;
}

message ModuleResult {
  repeated ModuleRowResult runs = 1; // one per request row, in order; empty unless outcome is completed
  int32 width = 2; // outputs per step, read from the module
  // Typed top-level conclusion, with the project run's meanings: completed means
  // every row has a result; setup_failed means the worker refused the request
  // (unknown model, malformed table); timed_out and protocol_error as for a
  // project. Pre-dispatch failures use the RPC status instead.
  ProjectOutcome outcome = 5;
  string outcome_detail = 6;
  // The worker's own streams: one summary line on stdout, diagnostics on stderr.
  // Bytes for the same reason as JavaScriptResult.stdout.
  bytes stdout = 7;
  bytes stderr = 8;
}

message OpenSessionRequest {
  uint32 protocol = 1; // see Run
  // The floor for the whole session, checked at open against the provider's
  // evidence; each call may state its own, checked against the tier measured
  // at open.
  string minimum_isolation = 2;
  string trace_id = 3; // see RunRequest.trace_id
  // Shorter than the daemon's own, or 0 for the daemon's.
  uint32 lifetime_ms = 4;
  uint32 idle_timeout_ms = 5;
  SoftwareRule software_rule = 6;
}

message OpenSessionResponse {
  // session_id is 128 random bits in hex: a capability. Send it only to the
  // daemon; it is never logged or recorded, and records carry its SHA-256.
  string session_id = 1;
  string session = 2; // the SHA-256 of session_id, as records carry it
  string sandbox = 3; // the provider
  string isolation = 4; // the tier measured at open
  int64 expires_unix_ms = 5;
  uint32 idle_timeout_ms = 6; // after this long without a call the sandbox is suspended
  string software_identity = 7; // selected image, when the provider can establish it
}

// SessionRunRequest is a RunRequest with a session ID, for a call in a session.
// It is a separate message so that a daemon that predates sessions refuses it
// (Unimplemented) instead of dropping the ID and running the payload alone. A
// module payload has no session form; a cell exists only in a session. A daemon
// that predates cells drops the cell payload and refuses the request as having
// none, marked not dispatched, so cells did not move the protocol number.
message SessionRunRequest {
  uint32 protocol = 1;
  string minimum_isolation = 2;
  string trace_id = 3;
  int32 timeout_ms = 4;
  string session_id = 5;
  SoftwareRule software_rule = 6;
  oneof payload {
    JavaScriptRun javascript = 10;
    ProjectRun project = 11;
    CellRun cell = 12;
  }
}

// CellRun is one call to the session's interpreter for its language. The session
// keeps one interpreter per language alive between calls, so what a cell defines is
// there for the next cell, as in a notebook. The files are written into the
// session's work directory, the interpreter's working directory, before the code
// runs. A cell carries no grant: its interpreter outlives the call, and a grant
// lives for one call.
message CellRun {
  string language = 1; // "javascript" or "python"; see PayloadEnvironment.languages
  string code = 2;
  repeated ProjectFile files = 3;
}

// CellResult is a cell's outcome. exit_code is 0 when the code ran without raising,
// 1 when it raised (the error is on stderr), and 124 when the call's deadline ended
// it. A final expression's value is printed to stdout, as a notebook shows it.
message CellResult {
  bytes stdout = 1;
  bytes stderr = 2;
  int32 exit_code = 3;
  bool timed_out = 4;
  bool stdout_truncated = 5;
  bool stderr_truncated = 6;
  // This call started a fresh interpreter: nothing an earlier cell defined exists.
  bool interpreter_started = 7;
  // The interpreter ended during this call (the code exited it, it was killed, or the
  // deadline passed); the next cell starts a fresh one.
  bool interpreter_ended = 8;
}

message SessionRunResponse {
  RunResponse run = 1; // its record carries the session's chain fields
  // Set when the session ended during or after this call (its lifetime passed,
  // its disk budget was exceeded, its sandbox's main process ended, or the
  // boundary between calls could not be established); later calls are refused.
  SessionEnd ended = 2;
  string end_detail = 3;
}

message CloseSessionRequest {
  uint32 protocol = 1;
  string session_id = 2;
}

message CloseSessionResponse {
  string session = 1; // the fingerprint
  // The calls the session executed and returned, with the last one's
  // record_sha256 (empty when there were none).
  uint64 calls = 2;
  string last_record_sha256 = 3;
  // Why the session ended: CLOSED for this request, or an earlier end.
  SessionEnd ended = 4;
}

// SessionEnd says why a session ended.
enum SessionEnd {
  SESSION_END_UNSPECIFIED = 0; // not ended
  SESSION_END_CLOSED = 1;
  SESSION_END_EXPIRED = 2;
  SESSION_END_DISK_EXCEEDED = 3;
  SESSION_END_MAIN_PROCESS_ENDED = 4;
  SESSION_END_BOUNDARY_FAILED = 5;
  SESSION_END_SANDBOX_CHANGED = 6;
  SESSION_END_SHUTDOWN = 7;
}

// SessionEnded is attached as an error detail to a SessionRun refused because
// its session has ended; it carries NotDispatched too, since nothing ran.
message SessionEnded {
  SessionEnd reason = 1;
  string detail = 2;
}

// NotDispatched is attached as an error detail to a Run (or Describe) error that
// was raised before any code was dispatched: nothing executed, so retrying the
// request or sending it to another daemon cannot run it twice. Only refusals that
// provably ran nothing carry it. An error WITHOUT this detail may have followed
// execution, whatever its status code, and is never a safe automatic-retry signal.
message NotDispatched {
  NotDispatchedReason reason = 1;
}

// UnansweredCall is the error detail of a session call that may have run but ended
// in an error (an error without NotDispatched): its version 3 record, which the
// session's chain counts, so a call that ran is never missing from the chain.
message UnansweredCall {
  RunRecord record = 1;
}

// NotDispatchedReason says why, in the terms a caller acts on: whether another
// daemon could take the same request.
enum NotDispatchedReason {
  NOT_DISPATCHED_REASON_UNSPECIFIED = 0;
  // Malformed or out of bounds. Every daemon refuses it the same way.
  NOT_DISPATCHED_REASON_REQUEST = 1;
  // Authentication, scope, or a grant profile's caller list. The caller's
  // identity is the problem, not this daemon.
  NOT_DISPATCHED_REASON_PERMISSION = 2;
  // The daemon serves another protocol number.
  NOT_DISPATCHED_REASON_PROTOCOL = 3;
  // This daemon's provider cannot perform the operation, or is disabled.
  NOT_DISPATCHED_REASON_UNSUPPORTED = 4;
  // The provider's current isolation evidence is below the request's floor.
  NOT_DISPATCHED_REASON_ISOLATION = 5;
  // Shed by admission or a rate limit; retry later or elsewhere.
  NOT_DISPATCHED_REASON_CAPACITY = 6;
  NOT_DISPATCHED_REASON_ENVIRONMENT = 7;
}
