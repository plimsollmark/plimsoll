# Copy to .github/workflows/pr-receipt.yml in a JavaScript project.
# Pin PLIMSOLL_RECEIPT_REF to a full published commit containing examples/sbom.
# Project code runs only inside plimsoll. Nothing posts a PR comment.
name: pull-request receipt
on:
  pull_request:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLIMSOLL_REF: ${{ vars.PLIMSOLL_RECEIPT_REF }}
      TEST_COMMAND: ${{ vars.PLIMSOLL_TEST_COMMAND || 'npm test' }}
      JUNIT_PATH: ${{ vars.PLIMSOLL_JUNIT_PATH }}
      PLIMSOLL_MIN_TESTS: ${{ vars.PLIMSOLL_MIN_TESTS }}
      COVERAGE_PATH: ${{ vars.PLIMSOLL_COVERAGE_PATH }}
      SESSION_TRAILER: ${{ vars.PLIMSOLL_SESSION_TRAILER }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_REPOSITORY: ${{ github.repository }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require an immutable plimsoll pin
        shell: bash
        run: |
          [[ "$PLIMSOLL_REF" =~ ^[a-f0-9]{40}$ ]] || { echo 'Set PLIMSOLL_RECEIPT_REF to a published full commit SHA containing examples/sbom'; exit 1; }
      - name: Check out the pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: project
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted pinned plimsoll tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: plimsollmark/plimsoll
          ref: ${{ env.PLIMSOLL_REF }}
          path: tools/plimsoll
          persist-credentials: false
      # Given a commit SHA, the checkout fetches that one commit and no tag, so the daemon would state (devel). This
      # step adds the release tags that name exactly that commit, and no other tag: it lists the repository's tags,
      # keeps each vMAJOR.MINOR.PATCH whose commit is PLIMSOLL_REF (an annotated tag's ^{} line names its commit) and
      # fetches those. It changes no file and does not move HEAD, so the code that runs is still the pinned commit, which
      # receipt.sh checks again. A tag shows only that plimsoll's repository named that commit with that release when
      # the job ran; tags can be moved and added, so the commit SHA alone decides what code runs, and a tag decides only
      # whether the receipt states the release (buildvcs.sh keeps the stamp only for a release tag naming HEAD) or
      # (devel).
      - name: Fetch the release tags that name the pinned commit
        shell: bash
        working-directory: tools/plimsoll
        run: |
          listed="$(git ls-remote --tags origin 'refs/tags/v*')"
          refs=()
          while read -r object ref; do
            tag="${ref#refs/tags/}"
            tag="${tag%'^{}'}"
            if [ "$object" = "$PLIMSOLL_REF" ] && [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              refs+=("+refs/tags/$tag:refs/tags/$tag")
            fi
          done <<< "$listed"
          if [ "${#refs[@]}" -gt 0 ]; then
            git fetch --no-tags --no-recurse-submodules --depth=1 origin "${refs[@]}"
          fi
          echo "Release tags naming $PLIMSOLL_REF: $(git tag --points-at HEAD | tr '\n' ' ')"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tools/plimsoll/go.mod
      - name: Install the pinned gVisor release
        run: sudo ./tools/plimsoll/docker/install-gvisor.sh
      - name: Keep the installed runtime and select the manifest-capable image store
        id: docker_config
        run: |
          python3 - <<'PYCONFIG' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          config = json.loads(Path('/etc/docker/daemon.json').read_text())
          config.setdefault('features', {})['containerd-snapshotter'] = True
          print('config=' + json.dumps(config, separators=(',', ':')))
          PYCONFIG
      - name: Set up pinned Docker with that runtime configuration
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: v29.9.0
          daemon-config: ${{ steps.docker_config.outputs.config }}
      # Trusted Dockerfile only. No dependency installation from the PR on the host. The
      # Dockerfile copies plimsoll's native helper from the named build context nativehelper,
      # as make docker-images passes it; without it the build fails before any receipt.
      - name: Build the project toolchain image
        run: >-
          docker build
          --build-context nativehelper=tools/plimsoll/sandbox/internal/nativehelper/program
          -t plimsoll/sandbox:latest tools/plimsoll/docker
      - name: Run the project and check its receipt
        id: run
        env:
          PLIMSOLL_SOURCE: ${{ github.workspace }}/tools/plimsoll
        run: ./tools/plimsoll/examples/pr-receipt/receipt.sh "$GITHUB_WORKSPACE/project" "$GITHUB_WORKSPACE/receipt"
      - name: Upload the checked receipt and bundle
        id: upload
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: plimsoll-pr-${{ github.event.pull_request.number }}
          path: receipt/
          if-no-files-found: error
      # One line per receipt state, from the checked receipt's states.json (none: says so),
      # and whether the upload kept it. The trusted pinned tools render it.
      - name: Write the receipt's states to the job summary
        if: ${{ always() }}
        env:
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python3 -I tools/plimsoll/examples/pr-receipt/states.py summary receipt/states.json \
            --uploaded "$UPLOAD_OUTCOME" --artifact "plimsoll-pr-$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
