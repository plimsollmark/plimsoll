# The agent-sandbox objects the live run makes on the kind cluster, in a namespace of its own,
# and deletes when it ends: plimsolld's service account with only the access the provider
# uses (docs/agentsandbox.md), the TLS Secret sandboxd's terminator serves, a gVisor template
# under the runtime class whose runsc logs every call the receipt reads, and a warm pool of
# two. The program fills in the fields in braces (Go's text/template).
apiVersion: v1
kind: Namespace
metadata: {name: {{.Namespace}}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: plimsoll, namespace: {{.Namespace}}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: plimsoll, namespace: {{.Namespace}}}
rules:
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxclaims]
  verbs: [create, get, list, delete]
- apiGroups: [extensions.agents.x-k8s.io]
  resources: [sandboxwarmpools, sandboxtemplates]
  verbs: [get]
- apiGroups: [agents.x-k8s.io]
  resources: [sandboxes]
  verbs: [get]
- apiGroups: [""]
  resources: [pods]
  verbs: [get]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: plimsoll, namespace: {{.Namespace}}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: plimsoll}
subjects: [{kind: ServiceAccount, name: plimsoll, namespace: {{.Namespace}}}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{.Namespace}}-runtimeclasses}
rules:
- apiGroups: [node.k8s.io]
  resources: [runtimeclasses]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{.Namespace}}-runtimeclasses}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{.Namespace}}-runtimeclasses}
subjects: [{kind: ServiceAccount, name: plimsoll, namespace: {{.Namespace}}}]
---
# The CA that signs each pod's own key pair, made by the program for this run alone, and
# cert-manager's CA issuer on it; plimsolld pins that CA (docs/agentsandbox.md, "The
# control channel is TLS"). The cluster needs cert-manager and its CSI driver.
apiVersion: v1
kind: Secret
metadata: {name: plimsoll-ca, namespace: {{.Namespace}}}
type: kubernetes.io/tls
data:
  tls.crt: {{.CACert}}
  tls.key: {{.CAKey}}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata: {name: plimsoll-ca, namespace: {{.Namespace}}}
spec: {ca: {secretName: plimsoll-ca}}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata: {name: {{.Pool}}, namespace: {{.Namespace}}}
spec:
  networkPolicy:
    ingress:
    - from:
      - ipBlock: {cidr: {{.Ingress}}}
      ports:
      - {port: 9090, protocol: TCP}
  podTemplate:
    spec:
      runtimeClassName: {{.RuntimeClass}}
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig: {nameservers: [127.0.0.1]}
      containers:
      - name: sandboxd
        image: {{.Image}}
        imagePullPolicy: Never
        command: ["/usr/local/bin/plimsoll-sandboxd-tls", "--root-dir=/work", "--listen-host=127.0.0.1", "--rest-port=8080", "--grpc-port=9091", "--auth-token-sha256={{.TokenSHA256}}"]
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL], add: [SETUID, SETGID]}
        resources:
          limits: {memory: {{.MemoryMB}}Mi, cpu: "1"}
        ports: [{containerPort: 9090}]
        terminationMessagePath: /root/termination-log
        readinessProbe:
          tcpSocket: {port: 9090}
          periodSeconds: 2
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: tmp, mountPath: /tmp}
        - {name: sandboxd-tls, mountPath: /etc/plimsoll/sandboxd-tls, readOnly: true}
      volumes:
      - {name: work, emptyDir: {medium: Memory, sizeLimit: 128Mi}}
      - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 32Mi}}
      - name: sandboxd-tls
        csi:
          driver: csi.cert-manager.io
          readOnly: true
          volumeAttributes:
            csi.cert-manager.io/issuer-name: plimsoll-ca
            csi.cert-manager.io/issuer-kind: Issuer
            csi.cert-manager.io/dns-names: {{.ServerName}}
            csi.cert-manager.io/uri-sans: "spiffe://{{.TrustDomain}}/ns/${POD_NAMESPACE}/pod/${POD_NAME}/${POD_UID}"
            csi.cert-manager.io/key-algorithm: ECDSA
            csi.cert-manager.io/key-size: "256"
            csi.cert-manager.io/key-encoding: PKCS8
            csi.cert-manager.io/key-usages: "server auth,digital signature"
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata: {name: {{.Pool}}, namespace: {{.Namespace}}}
spec:
  replicas: 2
  sandboxTemplateRef: {name: {{.Pool}}}
