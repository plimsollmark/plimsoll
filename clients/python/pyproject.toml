[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plimsoll-client"
version = "0.30.0"
description = "Client for plimsolld, the plimsoll sandbox daemon, that checks every run record it receives"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

# Framework adapters are optional imports (plimsoll_client.adk, .agno, .crewai, .langchain, .deepagents, .anthropic_worker, .openai_sandbox);
# each extra pins exactly the version its suite's lock file installs (clients/python/frameworks/<extra>/requirements.txt),
# held by TestAdaptersPinTheVersionTheirLockInstalls.
[project.optional-dependencies]
adk = ["google-adk==2.15.0"]
agno = ["agno==3.1.1"]
crewai = ["crewai==1.15.23"]
langchain = ["langchain-core==1.8.0"]
deepagents = ["deepagents==0.7.38"]
anthropic = ["anthropic==1.13.0"]
openai-agents = ["openai-agents==0.25.0"]
verifiers = ["verifiers==0.4.1.dev97"]

[project.urls]
Homepage = "https://github.com/plimsollmark/plimsoll/tree/main/clients/python"
Source = "https://github.com/plimsollmark/plimsoll"
Issues = "https://github.com/plimsollmark/plimsoll/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plimsoll_client = ["py.typed"]
