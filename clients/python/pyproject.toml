[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plimsoll-client"
version = "0.17.6"
description = "Client for plimsolld, the plimsoll sandbox daemon, that checks every run record it receives"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/plimsollmark/plimsoll/tree/main/clients/python"
Source = "https://github.com/plimsollmark/plimsoll"
Issues = "https://github.com/plimsollmark/plimsoll/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plimsoll_client = ["py.typed"]
