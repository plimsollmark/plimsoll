[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plimsoll-client"
version = "0.1.0"
description = "Client for plimsolld, the plimsoll sandbox daemon, that checks every run record it receives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/plimsollmark/plimsoll"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plimsoll_client = ["py.typed"]
