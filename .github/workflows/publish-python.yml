# Publishes the Python client (clients/python, distribution `plimsoll-client`) to PyPI
# through trusted publishing: PyPI accepts this workflow's short-lived GitHub identity
# token in place of a password or API token, so no PyPI credential exists to store or
# leak, and PyPI records which repository and workflow run uploaded each file.
#
# It runs when a GitHub release is published, and by hand (workflow_dispatch) for a
# release made before this file existed. Either way it publishes only what a release
# tag names: the client's version must have a tag `v<version>`, a release's tag must be
# that tag, and clients/python must be byte-identical to it at the commit being built.
# The release itself is gated by audit.yml on the tagged commit, so no test run here.
#
# PyPI side, once: a pending publisher (owner plimsollmark, repository plimsoll,
# workflow publish-python.yml, environment pypi). Actions are pinned by commit SHA.
name: publish-python

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: The client's version is a release tag, and the files are the tag's
        run: |
          version="$(python3 -c "import tomllib; print(tomllib.load(open('clients/python/pyproject.toml', 'rb'))['project']['version'])")"
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::release $GITHUB_REF_NAME does not match the client version $version"
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "::error::no tag $tag"; exit 1; }
          git diff --quiet "$tag" HEAD -- clients/python || { echo "::error::clients/python differs from $tag"; exit 1; }
          grep -qx "__version__ = \"$version\"" clients/python/src/plimsoll_client/_version.py ||
            { echo "::error::_version.py does not say $version"; exit 1; }
      - run: python3 -m pip install --require-hashes --no-deps -r clients/python/build-requirements.txt
      - run: python3 -m build --no-isolation --outdir dist clients/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/plimsoll-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
