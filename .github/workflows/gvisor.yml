# The kernel-tier run: the docker suite under gVisor (runsc), where the guest sees a
# user-space kernel instead of the host's. This is what the README calls the kernel
# tier, and it is the tier a hostile deployment is meant to run at.
#
# It is a separate workflow from audit.yml on purpose. The runc run there is the
# proven baseline; this one adds two things a hosted runner has to be able to do,
# neither of which is verified until a run has actually happened: install the
# pinned gVisor bundle with the committed installer (root, then a docker restart),
# and run gVisor's default systrap platform on the runner's VM. Keeping it apart
# means a red result here is attributable to runsc and cannot mask a green runc
# result, and a green result here is the first hosted proof of the kernel tier.
#
# The plain audit runs in audit.yml; this workflow runs only the required docker suite
# under runsc, through the same job definition audit.yml uses for runc
# (docker-suite.yml), each part of the suite a job of its own: the Go docker tests, and
# the Python client's checks on real docker sessions (the agent workspace, the verifiers
# runtime, the Deep Agents, Agent Framework and Google ADK environment adapters, and the
# example programs), so those run at the kernel tier here. Same rules as audit.yml: no E2B,
# no secrets, read-only permissions, actions pinned by commit SHA. The gVisor release
# itself is pinned by SHA-512 in docker/gvisor.versions and verified by the installer
# before anything is installed.
name: gvisor

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gvisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite's test helpers read SANDBOX_DOCKER_RUNTIME, which docker-suite.yml sets to
  # runsc for this runtime, so the docker provider under test, its startup smoke probe
  # included, runs its containers under runsc. The tests whose containers never ran under
  # it (the stand-in for E2B's service starts its own, naming no runtime) are left out of
  # this pass by the Makefile's DOCKER_RUNTIME_BLIND; the runc pass in audit.yml is where
  # they run.
  audit-runsc:
    uses: ./.github/workflows/docker-suite.yml
    with:
      runtime: runsc
