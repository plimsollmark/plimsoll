# The gate, run where a reader can see it.
#
# Three jobs, each using Makefile targets, so what a check claims and what the
# Makefile does cannot drift:
#
#   audit         `make audit`: build, vet, race tests, golangci-lint, buf lint plus a
#                 generated-code drift check, govulncheck. No required containers.
#   audit-docker  `make docker-images` then `make docker-suite`: the docker suite
#                 under runc with the shipped seccomp profile, in required mode.
#                 The audit job already runs the build, race tests and static checks.
#                 A missing daemon, a missing image or any skipped test fails this
#                 job, so a green check means the suite ran: a container came up
#                 read-only, every writable mount was a sized
#                 noexec tmpfs, the seccomp profile loaded, and the broker refused
#                 what it was meant to refuse.
#   clients       `make clients-suite`: install both npm lockfiles, then require
#                 the Python, TypeScript client, add-on and Trigger.dev suites.
#                 Missing prerequisites or any skipped Go test fails the job.
#
# The runsc (gVisor, kernel tier) run lives in gvisor.yml, separately, so its result
# is attributable on its own and cannot mask this one.
#
# Read README.md § Status for what a green check does NOT cover: the E2B suite is
# deliberately absent rather than merely unconfigured. It drives a live paid service,
# and no automated run in this project may spend. Do not add an API key to this
# repository's secrets to "complete" the gate.
#
# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable and
# repointing one is a supply-chain attack this repository is otherwise careful about
# (pinned gate tools, a SHA-256-pinned QuickJS artifact, a pinned gVisor release);
# leaving the CI that guards it on floating tags would be the loose end.
name: audit

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, comments, or writes to the repository.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod's `go` directive is the floor (1.26.2), not the canonical build. The
      # `toolchain go1.26.9` line is, because govulncheck is clean there and earlier
      # 1.26.x carried stdlib advisories in the HTTP/2 and reverse-proxy paths this
      # TCB calls. Whatever version setup-go lands, GOTOOLCHAIN=auto then honors that
      # toolchain line, so the gate runs on the pinned compiler either way.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Report the toolchain actually in use
        run: go version

      - name: Put installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Installs exactly the versions in gate-tools.versions. `make audit` runs
      # `tools-check` first and fails on any mismatch, so this step cannot silently
      # install something else and still report success.
      - name: Install the pinned gate tools
        run: make tools

      - name: make audit
        run: make audit

  # The required docker suite follows the audit job. `needs` keeps it from spending
  # runner minutes on containers when the plain gate already failed, and keeps a
  # docker failure attributable. ubuntu-latest ships a docker daemon.
  audit-docker:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Report the daemon and its runtimes
        run: docker info --format 'server {{.ServerVersion}} runtimes {{range $k, $v := .Runtimes}}{{$k}} {{end}}'

      # The suite launches the images by Preflight-verified content ID, so they must
      # exist on the daemon before the tests run; the test helpers fail (not skip)
      # when they do not, because DOCKER=1 is a request for proof.
      # DOCKER_HUB_MIRROR: Docker Hub refuses anonymous pulls past 100 per 6 hours per
      # address, and hosted runners share addresses; the Makefile says how the mirror
      # is used. The same setting is in gvisor.yml.
      - name: Pull the snippet image and build the project image
        env:
          DOCKER_HUB_MIRROR: mirror.gcr.io
        run: make docker-images

      - name: make docker-suite
        run: make docker-suite

  clients:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'

      - name: make clients-suite
        run: make clients-suite
