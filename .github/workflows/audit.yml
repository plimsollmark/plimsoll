# The gate, run where a reader can see it.
#
# These jobs, each using Makefile targets, so what a check claims and what the
# Makefile does cannot drift:
#
#   audit         `make audit`: build, vet, race tests, golangci-lint, buf lint plus a
#                 generated-code drift check, govulncheck. No required containers.
#   docker        docker-suite.yml under runc: `make docker-images`, then each part of
#                 `make docker-suite` as a job of its own (docker-go-suite and
#                 docker-py-suite), under runc with the shipped seccomp profile, in
#                 required mode. The audit job already runs the build, race tests and
#                 static checks. A missing daemon, a missing image or any skipped test
#                 fails a part's job, so a green check means the suite ran: a container
#                 came up read-only, every writable mount was a sized noexec tmpfs, the
#                 seccomp profile loaded, and the broker refused what it was meant to
#                 refuse; and the Python client's checks on real docker sessions (the
#                 agent workspace, the verifiers runtime, the Deep Agents, Agent Framework
#                 and Google ADK environment adapters and the example programs) ran, each
#                 in the environment its lock pins.
#   clients       `make clients-suite`: install the TypeScript client's npm lockfile,
#                 then require the Python, TypeScript client and add-on suites.
#                 Missing prerequisites or any skipped Go test fails the job. The
#                 Python checks on real docker sessions are the docker suite's, since
#                 this job builds no images.
#   capsule       `make capsule-suite`: the separate capsule example module and
#                 its hash-pinned Python reference verifier.
#   mcp           `make mcp-suite`: the MCP server's own Go module, its binary over
#                 stdio included, linted and scanned for known vulnerabilities.
#   sbom          `make sbom-suite`: the separate CycloneDX example module with
#                 pinned schemas, signed fixtures and integrity checks, offline.
#
# The runsc (gVisor, kernel tier) run lives in gvisor.yml, separately, so its result
# is attributable on its own and cannot mask this one.
#
# Every job starts at once; none waits for another. Until 2026-11-18 the other jobs waited
# for `audit` (`needs: audit`), to spend no runner minutes when the plain gate had already
# failed. Standard hosted runners are free on a public repository, so that saved nothing
# and cost every push the audit job's six to nine minutes before any docker test began.
# What the wait did keep is the Go cache: setup-go saves its cache only when its key
# missed, and the first job to finish decides what every job with that key restores, so
# each job here whose build differs from the audit job's has a key of its own
# (cache-dependency-path), and the shortest job cannot leave the audit job a cache with
# none of its race build.
#
# Read README.md § Status for what a green check does NOT cover: the E2B suite is
# deliberately absent rather than merely unconfigured. It drives a live paid service,
# and no automated run in this project may spend. Do not add an API key to this
# repository's secrets to "complete" the gate.
#
# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable and
# repointing one is a supply-chain attack this repository is otherwise careful about
# (pinned gate tools, a SHA-256-pinned QuickJS artifact, a pinned gVisor release);
# leaving the CI that guards it on floating tags would be the loose end.
name: audit

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Nothing here publishes, comments, or writes to the repository.
permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

# go test's limit for each test binary, under every job's limit here, so a hang ends with
# go test's dump of every goroutine instead of the runner being killed (the Makefile's
# GO_TEST_TIMEOUT says why this number). docker-suite.yml sets the same.
env:
  GO_TEST_TIMEOUT: 15m

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go.mod's `go` directive and its `toolchain` line both name go1.26.11, because
      # govulncheck is clean there and earlier 1.26.x carried stdlib advisories in the
      # HTTP/1, HTTP/2 and reverse-proxy paths this TCB calls. The `go` line is the one a
      # `go install ...@version` obeys (Go applies a toolchain line only to the module being
      # worked in), so an older local Go fetches 1.26.11 instead of building with itself. setup-go installs the version that toolchain line names and sets
      # GOTOOLCHAIN=local, so the gate runs on the pinned compiler and fetches no other
      # (a nested module needing a newer Go is skipped by `make modules`, said so).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Report the toolchain actually in use
        run: go version

      - name: Put installed tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Installs exactly the versions in gate-tools.versions. `make audit` runs
      # `tools-check` first and fails on any mismatch, so this step cannot silently
      # install something else and still report success.
      - name: Install the pinned gate tools
        run: make tools

      # The sweep's real-walk tests (sandbox/internal/sessionkit/sweep_real_test.go) run the walk
      # in a user and PID namespace of their own, and the race pass fails on a test skipped and
      # selected by no suite: Ubuntu's AppArmor default refuses that namespace to an unprivileged
      # process, so it is lifted here as in the clients job (the v0.30.0 push's audit job failed
      # on exactly these two skips).
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rpf --mount-proc true

      - name: make audit
        run: make audit

  # The required docker suite under runc, each of its parts a job of its own
  # (docker-suite.yml). ubuntu-latest ships a docker daemon.
  docker:
    uses: ./.github/workflows/docker-suite.yml
    with:
      runtime: runc

  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The TypeScript lockfile beside go.mod gives this job's Go cache a key of its own:
      # it builds the client test packages without the race detector, and it finishes
      # first, so on the audit job's key it would decide what that job restores.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.mod
            clients/typescript/package-lock.json

      # The framework locks (clients/python/frameworks) are compiled for one Python, and
      # make py-frameworks refuses any other python3. ubuntu-latest became Ubuntu 26.04
      # (python3 3.14) in November 2026, so the version is installed here, read from the
      # Makefile (PY_FRAMEWORKS_PYTHON, which internal/maketest checks against every lock's
      # header), as docker-suite.yml reads it with each part.
      - name: The Python the framework locks are for
        id: locks
        run: echo "python=$(make -s --no-print-directory py-frameworks-python)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.locks.outputs.python }}

      # Every framework environment, from GitHub's cache, keyed as in docker-suite.yml
      # (which says why each part of the key is there); make py-frameworks rebuilds any
      # whose stamp does not match its lock.
      - name: The framework environments' cache key
        id: frameworks
        env:
          PYTHON: ${{ steps.python.outputs.python-version }}
        run: echo "key=py-frameworks-$ImageOS-$PYTHON-$(make -s --no-print-directory py-frameworks-key)" >> "$GITHUB_OUTPUT"

      - name: Restore or save the framework environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/py-frameworks
          key: ${{ steps.frameworks.outputs.key }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'

      # The Agent Framework file store's tests carry out file calls with plimsoll's real helper
      # in a user and mount namespace of their own (clients/python/tests/_local_helper.py: the
      # helper's work scope needs the work folder to be a mount), and the suite fails on a skipped
      # case. Ubuntu's AppArmor default refuses such a namespace to an unprivileged process, so
      # the restriction is lifted on this throwaway runner (the job already has passwordless
      # sudo; a kernel without Ubuntu's sysctl has nothing to lift), and the check after it fails
      # the job here when a namespace still cannot be made.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare -rm true

      - name: make clients-suite
        run: make clients-suite

  # The capsule example is its own Go module, outside the root build, so `audit`
  # never compiles it. This job does, with the capsule project's Python reference
  # verifier installed from the example's hash-pinned lockfile, so the public
  # capsule page's checks run on every push. Its go.mod selects Go 1.27.2 with a
  # `toolchain` line, and setup-go installs that version when pointed at that go.mod;
  # setup-go also runs with GOTOOLCHAIN=local, so nothing downloads another toolchain
  # mid-job (the first run, on the root go.mod, failed with go 1.26.9 for that reason).
  capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each nested module's job keys its Go cache on its own go.sum (see the note at the top).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/capsule/go.mod
          cache-dependency-path: examples/capsule/go.sum

      - name: make capsule-suite
        run: make capsule-suite

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/mcp/go.mod
          cache-dependency-path: clients/mcp/go.sum

      - name: Install the pinned gate tools
        run: make tools

      - name: make mcp-suite
        run: make mcp-suite

  # The CycloneDX example is a separate module. Its evidence checks are offline.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: examples/sbom/go.mod
          cache-dependency-path: examples/sbom/go.sum

      - name: make sbom-suite
        run: make sbom-suite
