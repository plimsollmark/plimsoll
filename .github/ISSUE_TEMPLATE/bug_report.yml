name: Bug report
description: Something behaved differently from what the documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Vulnerabilities go through a private security advisory, not an issue; see SECURITY.md.
        A guest program that exits non-zero is a normal result, not a bug in plimsoll. A run that was refused, that ran behind a weaker tier than it reported, or that behaved differently from the README is.
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or commit, from `go list -m github.com/plimsollmark/plimsoll` in a consumer or `git rev-parse HEAD` in a clone.
      placeholder: v0.4.0
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: The SANDBOX_PROVIDER in force, and for docker, the runtime.
      options:
        - wasm
        - docker under runc
        - docker under runsc
        - e2b
        - unset (disabled)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the documentation says should happen
      description: Quote or link the README, AGENTS.md, a doc under docs/, or a lesson.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: The command or request, the response or error, and the daemon's log lines for that run. The audit line never contains code or tokens; check before pasting anything else.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, OS, docker and runsc versions where relevant, and the environment variables set (names only, never token values).
